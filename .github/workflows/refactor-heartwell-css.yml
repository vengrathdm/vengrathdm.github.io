name: Refactor Heartwell CSS

on:
  push:
    branches: [refactor/heartwell-css]

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove exact duplicate CSS rules
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          path = Path("subpages/Ksiazeta-Heartwell/heartwell.css")
          text = path.read_text(encoding="utf-8")

          def parse_container(src, start=0, end=None):
              if end is None:
                  end = len(src)
              nodes = []
              i = start
              chunk_start = start
              while i < end:
                  if src[i] == "{":
                      selector_start = chunk_start
                      selector = src[selector_start:i].strip()
                      depth = 1
                      j = i + 1
                      while j < end and depth:
                          if src[j] == "{":
                              depth += 1
                          elif src[j] == "}":
                              depth -= 1
                          j += 1
                      if depth:
                          raise ValueError("Unbalanced CSS braces")
                      raw = src[selector_start:j]
                      nodes.append((selector, raw, selector_start, j))
                      i = j
                      chunk_start = j
                  else:
                      i += 1
              return nodes

          def normalize_rule(raw):
              return re.sub(r"\\s+", " ", raw.strip())

          # Only deduplicate exact rule blocks at the same nesting level.
          # This cannot change cascade semantics because the removed block is
          # byte-equivalent in selector and declarations to the retained block.
          def dedupe_region(src):
              nodes = parse_container(src)
              if not nodes:
                  return src, 0

              removals = []
              seen = set()
              removed = 0

              for selector, raw, s, e in nodes:
                  key = normalize_rule(raw)
                  if key in seen:
                      removals.append((s, e))
                      removed += 1
                  else:
                      seen.add(key)

              if not removals:
                  return src, 0

              out = []
              pos = 0
              for s, e in removals:
                  out.append(src[pos:s])
                  pos = e
              out.append(src[pos:])
              return "".join(out), removed

          new_text, removed = dedupe_region(text)
          if removed:
              path.write_text(new_text, encoding="utf-8")
              print(f"Removed {removed} exact duplicate top-level CSS rules.")
          else:
              print("No exact duplicate top-level CSS rules found.")

      - name: Commit refactor
        shell: bash
        run: |
          if git diff --quiet -- subpages/Ksiazeta-Heartwell/heartwell.css; then
            echo "No CSS changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add subpages/Ksiazeta-Heartwell/heartwell.css
          git commit -m "Refactor Heartwell CSS duplicates"
          git push
