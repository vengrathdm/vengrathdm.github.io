name: Generate card manifest

on:
  push:
    branches: [main]
    paths:
      - "Home/Cards/**"
      - "subpages/moje-prace-graficzne/Pictures/**"
      - ".github/workflows/generate-card-manifest.yml"

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Home/Cards/index.json
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          cards = Path("Home/Cards")
          manifest = []
          for path in sorted(cards.glob("*.txt"), key=lambda p: p.name.lower()):
              lines = [line.strip() for line in path.read_text(encoding="utf-8-sig").splitlines()]
              if len(lines) < 4 or any(not line for line in lines[:4]):
                  raise SystemExit(f"Invalid card: {path}")
              title, tag, graphic, link = lines[:4]
              manifest.append({
                  "name": path.name,
                  "title": title,
                  "tag": tag,
                  "graphic": graphic,
                  "link": link,
              })

          (cards / "index.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          PY

      - name: Generate Pictures/index.json
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          pictures = Path("subpages/moje-prace-graficzne/Pictures")
          extensions = {".avif", ".gif", ".jpeg", ".jpg", ".png", ".webp"}
          files = sorted(
              p.name for p in pictures.iterdir()
              if p.is_file() and p.suffix.lower() in extensions
          )

          manifest = [
              {"name": name, "url": name}
              for name in files
          ]

          (pictures / "index.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          PY

      - name: Commit manifest when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Home/Cards/index.json subpages/moje-prace-graficzne/Pictures/index.json
          git diff --cached --quiet && exit 0
          git commit -m "Update card manifest"
          git push
