name: Campaign page integrity

on:
  push:
    branches: [main, "audit/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  campaign-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate campaign pages and local references
        run: python scripts/audit_campaign_pages.py
      - name: Check Python syntax
        run: python -m py_compile scripts/audit_campaign_pages.py
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check shared component JavaScript syntax
        run: find res/common -name "*.js" -print0 | xargs -0 -n1 node --check
