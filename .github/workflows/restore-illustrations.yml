name: Restore legacy illustration assets

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: ${{ github.event.head_commit.message != 'Restore legacy illustration assets' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Restore illustration files from the last intact tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import urllib.request

          repo = 'vengrathdm/vengrathdm.github.io'
          ref = '57de2e9714ed5d9ccc7731e5f9d0785d2cd25909'
          api = f'https://api.github.com/repos/{repo}/contents/illustrations/graphics?ref={ref}'
          token = os.environ['GH_TOKEN']
          extensions = {'.avif', '.gif', '.jpeg', '.jpg', '.png', '.svg', '.webp'}

          def request_json(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          def download(url, destination):
              req = urllib.request.Request(url, headers={'Authorization': f'Bearer {token}'})
              destination.parent.mkdir(parents=True, exist_ok=True)
              with urllib.request.urlopen(req) as response, destination.open('wb') as output:
                  output.write(response.read())

          def walk(url):
              for entry in request_json(url):
                  destination = pathlib.Path(entry['path'])
                  if entry['type'] == 'dir':
                      walk(entry['url'])
                  elif entry['type'] == 'file' and destination.suffix.lower() in extensions:
                      download(entry['download_url'], destination)
                      print(f'Restored {destination}')

          walk(api)
          PY

      - name: Commit restored assets and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add illustrations/graphics
          git rm .github/workflows/restore-illustrations.yml
          git commit -m "Restore legacy illustration assets"
          git push origin HEAD:main
