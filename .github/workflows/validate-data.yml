name: Validate central data

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "core/**"
      - "subpages/**"
      - ".github/workflows/validate-data.yml"
  pull_request:
    paths:
      - "data/**"
      - "core/**"
      - "subpages/**"
      - ".github/workflows/validate-data.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate IDs, relations and assets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path(".")
          data = root / "data"

          def load(name):
              with (data / name).open(encoding="utf-8") as f:
                  return json.load(f)

          campaigns = load("campaigns.json")["campaigns"]
          characters = load("characters.json")["characters"]
          players = load("players.json")["players"]
          assets = load("assets.json")["assets"]
          worlds = load("worlds.json")["worlds"]
          modules = load("modules.json")["modules"]
          home_cards = load("home-cards.json")["cards"]
          migration_map = load("migration-map.json")["campaigns"]

          def unique(items, key, label):
              values = [x.get(key) for x in items]
              dupes = sorted({v for v in values if values.count(v) > 1})
              if dupes:
                  raise SystemExit(f"Duplicate {label}: {dupes}")

          unique(campaigns, "id", "campaign IDs")
          unique(characters, "id", "character IDs")
          unique(players, "id", "player IDs")
          unique(assets, "id", "asset IDs")
          unique(worlds, "id", "world IDs")
          unique(modules, "id", "module IDs")
          unique(home_cards, "id", "home card IDs")
          unique(migration_map, "id", "migration campaign IDs")

          campaign_ids = {x["id"] for x in campaigns}
          player_ids = {x["id"] for x in players}
          asset_ids = {x["id"] for x in assets}
          character_ids = {x["id"] for x in characters}
          migration_ids = {x["id"] for x in migration_map}

          errors = []

          missing_migration = sorted(campaign_ids - migration_ids)
          unknown_migration = sorted(migration_ids - campaign_ids)
          if missing_migration:
              errors.append(f"migration-map missing campaigns: {missing_migration}")
          if unknown_migration:
              errors.append(f"migration-map unknown campaigns: {unknown_migration}")

          for route in migration_map:
              if route.get("status") == "detailed":
                  record = data / "campaigns" / f"{route['slug']}.json"
                  if not record.exists():
                      errors.append(f"{route['id']}: missing detailed campaign record {record}")
                  canonical = root / "campaigns" / route["slug"] / "index.html"
                  if not canonical.exists():
                      errors.append(f"{route['id']}: missing canonical route {canonical}")
              legacy = route.get("legacyPath")
              if legacy:
                  legacy_file = root / legacy.lstrip("/")
                  if legacy_file.is_dir():
                      legacy_file = legacy_file / "index.html"
                  if not legacy_file.exists():
                      errors.append(f"{route['id']}: missing legacy route {legacy}")

          for c in characters:
              if c.get("playerId") not in player_ids:
                  errors.append(f'{c["id"]}: missing player {c.get("playerId")}')
              if c.get("portraitId") not in asset_ids:
                  errors.append(f'{c["id"]}: missing portrait {c.get("portraitId")}')
              for cid in c.get("campaignIds", []):
                  if cid not in campaign_ids:
                      errors.append(f'{c["id"]}: missing campaign {cid}')

          for a in assets:
              path = a.get("path", "")
              if path.startswith("/") and not path.startswith("//"):
                  local = root / path.lstrip("/")
                  if not local.exists():
                      errors.append(f'{a["id"]}: missing asset file {path}')

          for path in sorted((data / "campaigns").glob("*.json")):
              record = json.loads(path.read_text(encoding="utf-8"))
              for cid in record.get("characters", {}).get("ids", []):
                  if cid not in character_ids:
                      errors.append(f'{path}: missing character {cid}')

              audio = record.get("audio")
              if audio and not audio.startswith(("http://", "https://", "/")):
                  route = next((x for x in migration_map if x.get("slug") == record.get("slug")), None)
                  legacy = route.get("legacyPath") if route else None
                  base = root / legacy.lstrip("/") if legacy else root / "subpages" / path.stem
                  if base.is_dir():
                      base = base / audio.lstrip("./")
                  else:
                      base = root / "subpages" / path.stem / audio.lstrip("./")
                  if not base.exists():
                      errors.append(f'{path}: missing campaign audio {audio} (checked {base})')

          # Any explicit stable character reference in HTML must resolve centrally.
          for html in sorted(root.glob("subpages/**/*.html")):
              text = html.read_text(encoding="utf-8")
              import re
              for cid in re.findall(r'data-character-id="([^"]+)"', text):
                  if cid not in character_ids:
                      errors.append(f'{html}: missing character {cid}')

          if errors:
              print("\n".join(errors))
              raise SystemExit(f"Validation failed with {len(errors)} error(s).")

          print(
              f"Validated {len(campaigns)} campaigns, "
              f"{len(characters)} characters, {len(players)} players, "
              f"{len(assets)} assets, {len(worlds)} worlds, "
              f"{len(modules)} modules, {len(home_cards)} home cards, "
              f"{len(migration_map)} migration routes."
          )
          PY
