name: Validate Vengrath data

on:
  push:
    branches: [main]
    paths: ['data/**','core/**','tools/**','package.json','.github/workflows/validate-data.yml']
  pull_request:
    paths: ['data/**','core/**','tools/**','package.json','.github/workflows/validate-data.yml']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm run validate:data
