<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08090b">
  <meta name="description" content="Vengrath — kampanie, postacie, kroniki i projekty fantasy.">
  <title>Vengrath — Home</title>
  <link rel="icon" href="/core/graphics/favicon/favicon.ico">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fira+Sans+Extra+Condensed:wght@400;500;600;700&family=Voltaire&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/home/home2.css">
  <link rel="stylesheet" href="/core/templates/Cursor/Cursor.css">
</head>
<body>
  <canvas id="atmosphere" aria-hidden="true"></canvas>
  <div class="grain" aria-hidden="true"></div>

  <div class="home-app" id="app">
    <header class="topbar">
      <a class="brand" href="/home/" aria-label="Vengrath — strona główna">
        <img src="/core/graphics/favicon/mg-logo.png" alt="">
        <span>VENGRATH</span>
      </a>
      <nav id="filters" class="filters" aria-label="Tagi"></nav>
      <button id="clear-active-filters" class="clear-filters" type="button" hidden>Wyczyść</button>
      <button id="preview-toggle" class="preview-toggle" type="button" aria-pressed="false">Preview</button>
      <label class="search">
        <span aria-hidden="true">⌕</span>
        <input id="search" type="search" placeholder="Szukaj…" aria-label="Szukaj wpisów">
      </label>
    </header>

    <main class="viewport" id="viewport" aria-label="Odkrywaj kolekcję Vengrath">
      <div class="board-wrap">
        <div id="board" class="board"></div>
      </div>
      <div id="empty-state" class="empty-state" role="status" aria-live="polite" hidden>
        <p>Brak wyników. Zmień wyszukiwanie lub wybrane tagi.</p>
        <button id="clear-filters" type="button">Wyczyść filtry</button>
      </div>
    </main>

    <div class="card-context-menu" id="card-context-menu" role="menu" aria-label="Opcje wpisu" hidden>
      <button type="button" role="menuitem" data-action="preview">Pokaż podgląd</button>
      <button type="button" role="menuitem" data-action="new-tab">Otwórz w nowej karcie</button>
      <button type="button" role="menuitem" data-action="open-image">Otwórz obraz w nowej karcie</button>
      <div class="context-menu-divider" aria-hidden="true"></div>
      <button type="button" role="menuitem" data-action="copy-image">Kopiuj adres obrazu</button>
      <button type="button" role="menuitem" data-action="copy-link">Kopiuj adres linku</button>
    </div>

    <div class="context-preview-backdrop" id="context-preview-backdrop" hidden>
      <section class="context-preview-window" id="context-preview-window" role="dialog" aria-modal="false" aria-labelledby="context-preview-title">
        <button class="context-preview-close" id="context-preview-close" type="button" aria-label="Zamknij podgląd">×</button>
        <div class="context-preview-art">
          <img id="context-preview-image" alt="">
        </div>
        <div class="context-preview-info">
          <span class="context-preview-category" id="context-preview-category"></span>
          <h2 id="context-preview-title"></h2>
          <p id="context-preview-description"></p>
          <a id="context-preview-open" href="#" target="_blank" rel="noopener noreferrer">OTWÓRZ WPIS <b>↗</b></a>
        </div>
      </section>
    </div>

    <aside class="preview" id="preview" aria-hidden="true">
      <div class="preview-image-wrap">
        <img id="preview-image" alt="">
        <span class="preview-index">ZAPISKI</span>
      </div>
      <div class="preview-copy">
        <span id="preview-category" class="preview-category"></span>
        <h2 id="preview-title"></h2>
        <p id="preview-description"></p>
        <span class="preview-open">OTWÓRZ <b>↗</b></span>
      </div>
    </aside>
  </div>

  <script type="module" src="/home/home2.js"></script>
  <script src="/core/templates/Cursor/Cursor.js" defer></script>
</body>
</html>
