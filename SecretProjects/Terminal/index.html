<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050505">
<meta name="description" content="DOMINION — terminal operacyjny kampanii.">
<title>DOMINION // Terminal kampanii</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div id="app" class="terminal">
<header class="topbar">
  <div><div class="eyebrow">[ WĘZEŁ // DOSTĘP UKRYTY // DOMINION ]</div><div class="brand">TERMINAL KAMPANII</div><div class="subtitle">CENTRALNY SYSTEM OPERACYJNY // ZAKON PRZYGODY</div></div>
  <div class="top-status"><span class="pulse"></span><b id="networkStatus">HOLO-SIEĆ AKTYWNA</b><span>WĘZEŁ <b>OR-77-19</b></span><span>TRYB <b id="modeLabel">STRAŻNIK GRY</b></span></div>
</header>
<div class="shell">
<aside class="sidebar"><div class="side-title">SYSTEM</div><nav id="nav"></nav><div class="side-title tools-title">NARZĘDZIA</div><button class="nav-action" data-action="palette">⌘K / PALETA KOMEND</button><button class="nav-action" data-action="export">↓ EKSPORT KAMPANII</button><button class="nav-action" data-action="import">↑ IMPORT KAMPANII</button><input id="importFile" type="file" accept="application/json" hidden></aside>
<main id="main" class="main"></main>
</div>
<footer><span>DOMINION // MODEL ŚWIATA PERSISTENTNY</span><span id="clock">--:--:--</span><span>LOKALNIE ZAPISANE</span></footer>
</div>
<div id="modal" class="modal" aria-hidden="true"><div class="modal-card"><button class="modal-close" data-action="close">×</button><div id="modalContent"></div></div></div>
<div id="toast" class="toast"></div>
<script src="assets/app.js"></script>
</body>
</html>
