<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171813"><title>Mapa Doliny Hommlet — Świątynia Pierwotnego Zła</title><link rel="stylesheet" href="/page/ksiazeta-heartwell/HeartwellMap/leaflet/leaflet.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"><style>
:root{--bg:#171813;--paper:#e8dfc8;--gold:#c8a45d;--line:#625a3c;--panel:#20231c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--paper);font-family:'IBM Plex Mono',monospace}#map{position:absolute;inset:0;background-color:#333a2d;background-image:radial-gradient(ellipse at 24% 22%,#596344 0 8%,transparent 9%),radial-gradient(ellipse at 73% 68%,#505c3c 0 12%,transparent 13%),radial-gradient(ellipse at 53% 42%,#716b4d 0 7%,transparent 8%),linear-gradient(32deg,transparent 47%,#9b8a5a 48%,#9b8a5a 49%,transparent 50%),linear-gradient(120deg,transparent 48%,#8d8055 49%,#8d8055 50%,transparent 51%);background-size:100% 100%}.leaflet-container{font-family:'IBM Plex Mono',monospace}.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#20231c;color:#e8dfc8;border:1px solid #c8a45d;border-radius:2px}.leaflet-popup-content{line-height:1.55}.leaflet-popup-content b{color:#d6b66d;font-family:'Cinzel',serif}.leaflet-control-zoom a{background:#20231c!important;color:#e8dfc8!important;border-color:#625a3c!important}.panel{position:absolute;z-index:500;background:#171813eF;border:1px solid var(--line);padding:14px 17px;box-shadow:0 8px 30px #0006}.head{top:18px;left:18px;max-width:min(390px,calc(100% - 36px))}.head a{color:var(--gold);text-decoration:none;font-size:10px;letter-spacing:.16em}.head h1{font:600 20px 'Cinzel',serif;margin:10px 0 4px}.head p{font-size:10px;color:#b9b199;margin:0}.legend{right:18px;top:18px;display:grid;gap:9px;font-size:10px}.legend span{display:flex;gap:9px;align-items:center}.dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:#c8a45d}.dot.red{background:#b45c3d}.dot.green{background:#8e9a60}.foot{bottom:18px;left:18px;font-size:9px;color:#b9b199}.back{bottom:18px;right:18px;color:var(--gold);text-decoration:none;font-size:10px}.leaflet-tooltip{background:#20231c;color:#e8dfc8;border:1px solid #c8a45d}
</style></head><body><div id="map"></div><header class="panel head"><a href="../">VENGRATH / ŚWIĄTYNIA PIERWOTNEGO ZŁA</a><h1>Dolina Hommlet</h1><p>MAPA OPERACYJNA · GREYHAWK · 591 CY</p></header><aside class="panel legend"><span><i class="dot green"></i> Osada / sojusznicy</span><span><i class="dot"></i> Ruiny / odkrycia</span><span><i class="dot red"></i> Zagrożenie / kult</span></aside><div class="panel foot">MAKIETA KARTOGRAFICZNA · ZNACZNIKI INTERAKTYWNE · PRZECIĄGNIJ, PRZYBLIŻ</div><a class="panel back" href="../#map">← POWRÓT DO KAMPANII</a>
<script src="/page/ksiazeta-heartwell/HeartwellMap/leaflet/leaflet.js"></script><script>
const map=L.map('map',{crs:L.CRS.Simple,minZoom:-1,maxZoom:2,zoomControl:true,attributionControl:false});
const bounds=[[0,0],[100,160]];
L.rectangle(bounds,{color:'#c8a45d',weight:1,fillColor:'#596344',fillOpacity:.08}).addTo(map);
const regions=[[[15,12],[30,18],[38,35],[24,46],[8,34]],[[62,12],[82,20],[89,38],[75,51],[59,38]],[[12,105],[29,116],[34,139],[17,150],[5,130]],[[62,102],[80,115],[88,137],[70,151],[55,132]]];
regions.forEach((p,i)=>L.polygon(p,{color:i===2?'#b45c3d':'#a6a078',weight:1,fillColor:i===2?'#7e4939':'#747b50',fillOpacity:.32,dashArray:'4 5'}).addTo(map));
const places=[
{n:'Hommlet',p:[78,30],t:'green',d:'Spokojna osada na skraju doliny. Gospoda Pod Wesołym Olbrzymem, świątynia św. Cuthberta i domy sołtysa.'},
{n:'Gospoda Pod Wesołym Olbrzymem',p:[73,34],t:'green',d:'Miejsce spotkań podróżnych. Właściciel słyszał rozmowy o dostawach dla Moathouse.'},
{n:'Świątynia św. Cuthberta',p:[83,24],t:'green',d:'Ufortyfikowana kaplica i bezpieczny punkt drużyny. Rufus i Burne mogą pomóc w śledztwie.'},
{n:'Moathouse',p:[48,58],t:'gold',d:'Zrujnowana warownia na mokradłach. Dawna placówka kultystów i wejście do podziemi.'},
{n:'Stary kurhan',p:[35,88],t:'gold',d:'Komora grobowa z mapą czterech sanktuariów. Na ścianie widnieje symbol pięciu kręgów.'},
{n:'Ruiny Świątyni',p:[24,128],t:'red',d:'Rozległy kompleks poświęcony pierwotnemu złu. Cztery skrzydła odpowiadają żywiołom.'},
{n:'Sanktuarium Ognia',p:[17,139],t:'red',d:'Ciepło wydobywa się ze szczelin w kamieniu. Ślady rytuału są świeże.'},
{n:'Sanktuarium Wody',p:[31,117],t:'red',d:'Zalane korytarze i ślady kultystów w błotnistych osadach.'},
{n:'Sanktuarium Ziemi',p:[10,119],t:'red',d:'Podziemna sala wsparta na kamiennych filarach. Słychać drgania pod posadzką.'},
{n:'Sanktuarium Powietrza',p:[34,145],t:'red',d:'Wysoka wieża bez dachu. Wiatr niesie szepty w nieznanym języku.'},
{n:'Obóz kupiecki',p:[61,77],t:'green',d:'Porzucony obóz wędrownych handlarzy. W popiele znaleziono fragment glinianej tabliczki.'},
{n:'Zaginiony trakt',p:[89,91],t:'gold',d:'Stary szlak omijany przez miejscowych. Zniknęły tu dwa wozy z zaopatrzeniem.'}
];
places.forEach(v=>{const color=v.t==='red'?'#b45c3d':v.t==='green'?'#8e9a60':'#c8a45d';const m=L.circleMarker(v.p,{radius:8,color:'#171813',weight:2,fillColor:color,fillOpacity:1}).addTo(map);m.bindPopup('<b>'+v.n+'</b><br>'+v.d);m.bindTooltip(v.n,{direction:'top'});});
const road=L.polyline([[78,30],[48,58],[35,88],[24,128]],{color:'#d2bd82',weight:2,dashArray:'7 8',opacity:.8}).addTo(map);
map.fitBounds(bounds);
window.addEventListener('message',e=>{if(e.data==='resize-map')setTimeout(()=>map.invalidateSize(),100)});
</script></body></html>
