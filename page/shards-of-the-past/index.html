<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Shards of the Past — archiwum kampanii science fantasy w Antarriah, świata Pradawnych, zapomnianych ruin i technologii."
    />
    <meta name="theme-color" content="#050b1b" />
    <title>Shards of the Past — Vengrath</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="./theme-fonts.css" />
    <link rel="stylesheet" href="/core/templates/HomeButton/HomeButton.css" />
    <link
      rel="stylesheet"
      href="/core/templates/SubpageNavbar/SubpageNavbar.css"
    />
    <link
      rel="stylesheet"
      href="/core/templates/SubpageNavbar/NavbarButton/NavbarButton.css"
    />
    <link
      rel="stylesheet"
      href="/core/templates/SubpageHero/SubpageHero.css"
    />
    <link
      rel="stylesheet"
      href="/core/templates/AudioPlayerButton/AudioPlayerButton.css"
    />
    <link rel="stylesheet" href="./sections/campaign/campaign.css" />
    <link rel="stylesheet" href="./sections/world/world.css" />
  </head>
  <body class="shards-of-the-past-page">
    <div id="campaign-hero"></div>
    <main class="ddc-content">
      <section class="ddc-tab-panel" id="campaign" data-page-section="campaign">
        <section class="ddc-card">
          <div class="ddc-card-title">
            <span>01</span><strong>AKTA KAMPANII</strong>
          </div>
          <div class="ddc-card-body">
            <div class="ddc-intro-grid">
              <article class="ddc-paper">
                <div class="ddc-section-mark">O KAMPANII</div>
                <h2 id="campaign-intro-title"></h2>
                <div id="campaign-intro-copy"></div>
              </article>
              <aside class="ddc-case" aria-label="Dossier kampanii">
                <div class="ddc-case-label">DOSSIER</div>
                <div id="campaign-dossier"></div>
              </aside>
            </div>
            <div class="ddc-audio-row">
              <div class="ddc-audio-label">
                <span
                  class="ddc-section-mark"
                  id="campaign-audio-kicker"
                ></span>
                <span id="campaign-audio-title"></span>
              </div>
              <p>
                Odtwarzacz w rogu ekranu pozwala uruchomić muzykę i dostosować
                głośność.
              </p>
            </div>
          </div>
        </section>
      </section>

      <section
        class="ddc-tab-panel"
        id="world"
        data-page-section="world"
        hidden
      >
        <section class="ddc-section ddc-world-intro">
          <div class="ddc-section-mark" id="world-kicker"></div>
          <h2 id="world-title"></h2>
          <p id="world-description"></p>
        </section>
        <div id="world-grid" class="ddc-world-grid"></div>
      </section>
    </main>
    <footer class="ddc-footer">
      <span>VENGRATH · SHARDS OF THE PAST</span>
      <a href="#campaign-hero">POWRÓT NA GÓRĘ ↑</a>
    </footer>
    <script type="module" src="./app.js"></script>
  </body>
</html>
