<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Gothic2 — fanowska kronika kampanii inspirowanej Gothic II i dodatkiem Noc Kruka."
    />
    <meta name="theme-color" content="#0b1116" />
    <title>Gothic2 — Vengrath</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@500;600;700&amp;family=IM+Fell+English:ital@0;1&amp;family=Spectral:wght@400;500;600;700&amp;display=swap" />
    <link rel="stylesheet" href="/core/templates/HomeButton/HomeButton.css" />
    <link rel="stylesheet" href="/core/templates/SubpageNavbar/SubpageNavbar.css" />
    <link rel="stylesheet" href="/core/templates/SubpageNavbar/NavbarButton/NavbarButton.css" />
    <link rel="stylesheet" href="/core/templates/SubpageHero/SubpageHero.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="gothic2-page">
    <div id="campaign-navbar"></div>
    <div id="campaign-hero"></div>

    <main class="gothic-content">
      <section
        class="gothic-panel"
        id="campaign"
        aria-labelledby="campaign-heading"
      >
        <div id="campaign-overview"></div>
      </section>

      <section
        class="gothic-panel"
        id="world"
        aria-labelledby="world-heading"
      >
        <div id="world-content"></div>
      </section>

      <section
        class="gothic-panel"
        id="chronicle"
        aria-labelledby="chronicle-heading"
      >
        <div id="chronicle-content"></div>
      </section>

      <section
        class="gothic-panel"
        id="guilds"
        aria-labelledby="guilds-heading"
      >
        <div id="guild-content"></div>
      </section>
    </main>

    <footer class="gothic-footer">
      <p id="fan-notice"></p>
      <a id="official-source" target="_blank" rel="noopener noreferrer"></a>
      <a class="back-to-top" href="#campaign-hero">Wróć na początek ↑</a>
    </footer>

    <script type="module" src="./app.js"></script>
  </body>
</html>
