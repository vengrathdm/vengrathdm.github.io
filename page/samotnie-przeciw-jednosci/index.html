    <link rel="stylesheet" href="/core/templates/HomeButton/HomeButton.css" />
    <link

      href="/core/templates/YouTubePlaylistButton/YouTubePlaylistButton.css"

    <link

      href="/core/templates/SubpageNavbar/SubpageNavbar.css"

    <link

      href="/core/templates/SubpageNavbar/NavbarButton/NavbarButton.css"

  <body class="samotnie-przeciw-jednosci-page campaign-startup-loading">
    <header
      class="subpage-hero"
      id="campaign-hero"
      style="--hero-background: url('/core/graphics/voronoi/samotnie-przeciw-jednosci.webp')"
    >
      <div class="subpage-hero__copy">
        <p class="campaign-startup-kicker">
          D&amp;D · ARCHIWUM KAMPANII
        </p>
        <h1>
          Samotnie Przeciw Jedności
        </h1>
        <p class="campaign-startup-lead">
          Wyprawa do miasta, w którym medyna, port i modernistyczne fasady przykrywają starszą
          historię.
        </p>
      </div>
    </header>
    <main class="ddc-content">
      <section class="ddc-tab-panel" id="campaign" data-page-section="campaign">
        <div id="campaign-section-content"></div>
      </section>
      <section
        class="ddc-tab-panel"
        id="characters"
        data-page-section="characters"
        hidden
      >
        <section class="ddc-section ddc-character-intro">
          <div class="ddc-section-mark" id="characters-kicker"></div>
          <h2 id="characters-title"></h2>
          <p id="characters-description"></p>
        </section>
        <div id="character-gallery"></div>
      </section>
      <section
        class="ddc-tab-panel ddc-chronicle-panel"
        id="chronicle"
        data-page-section="chronicle"
        hidden
      >
        <div id="chronicle-section-content"></div>
      </section>
    </main>
    <footer class="ddc-footer">
      <span></span><a href="#top">POWRÓT NA GÓRĘ ↑</a>
    </footer>
    <script type="module" src="./app.js"></script>
