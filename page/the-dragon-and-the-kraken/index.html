<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0d0f" />
    <title>Vengrath — Adventure Archive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fira+Sans+Extra+Condensed:wght@400;500;600;700&amp;family=Voltaire&amp;family=Brygada+1918:wght@400;500;600;700&amp;display=swap"
    />
    <link
      rel="stylesheet"
      href="/core/templates/CampaignPage/CampaignStartup.css"
    />
    <link rel="stylesheet" href="/core/templates/HomeButton/HomeButton.css" />
    <link
      rel="stylesheet"
      href="/core/templates/SubpageNavbar/SubpageNavbar.css"
    />
    <link
      rel="stylesheet"
      href="/core/templates/SubpageNavbar/NavbarButton/NavbarButton.css"
    />
    <link
      rel="stylesheet"
      href="/core/templates/SubpageHero/SubpageHero.css"
    />
    <link rel="stylesheet" href="./page.css" />
  </head>
  <body class="campaign-page campaign-startup-loading">
    <header
      class="subpage-hero"
      id="campaign-hero"
      style="--hero-background: url('/core/graphics/voronoi/dragon-and-the-kraken.webp')"
    >
      <div class="subpage-hero__copy">
        <p class="campaign-startup-kicker">
          D&amp;D · NIEURUCHOMIONA PRZYGODA
        </p>
        <h1>
          The Dragon and the Kraken
        </h1>
        <p class="campaign-startup-lead">
          Mroczna przygoda morska wokół Port Mercy, miasta portowego opanowanego przez strach i coraz
          liczniejszych nieumarłych wyrzucanych przez morze.
        </p>
      </div>
    </header>
    <main class="campaign-content">
      <section
        class="campaign-panel"
        id="campaign"
        data-page-section="campaign"
      >
        <div id="campaign-content"></div>
      </section>
      <section
        class="campaign-panel"
        id="materials"
        data-page-section="materials"
        hidden
      >
        <div id="materials-content"></div>
      </section>
    </main>
    <footer class="campaign-footer">
      <span id="footer-title"></span><a href="#top">POWRÓT NA GÓRĘ ↑</a>
    </footer>
    <script type="module" src="./app.js"></script>
  </body>
</html>
