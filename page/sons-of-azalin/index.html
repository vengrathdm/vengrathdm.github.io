<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Grupa awanturników zaprawionych w bojach przeniesiona została do przedziwnej krainy pełnej klątw, potężnych nieumarłych i opresji Dobrego Króla Azalina."
    />
    <meta name="theme-color" content="#08090d" />
    <title>Sons of Azalin — Vengrath</title>
    <link rel="preload" as="image" href="/page/sons-of-azalin/res/graphics/sons-of-azalin.webp" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fira+Sans+Extra+Condensed:wght@400;500;600;700&amp;family=Voltaire&amp;family=Brygada+1918:wght@400;500;600;700&amp;display=swap"
    />
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
      <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="sons-of-azalin-page campaign-startup-loading">
    <header
      class="subpage-hero"
      id="campaign-hero"
      style="--hero-background: url('/page/sons-of-azalin/res/graphics/sons-of-azalin.webp')"
    >
      <div class="subpage-hero__copy">
        <p class="soa-hero-kicker">
          D&amp;D · ARCHIWUM KAMPANII
        </p>
        <h1>
          Sons of
          <br />
          <span class="soa-hero-title-accent">Azalin</span>
        </h1>
        <p class="soa-hero-lead">
          Grupa awanturników zaprawionych w bojach przeniesiona została do przedziwnej krainy pełnej
          klątw, potężnych nieumarłych i opresji Dobrego Króla Azalina.
        </p>
      </div>
    </header>
    <main class="ddc-content" aria-busy="true">
      <section class="ddc-tab-panel" id="campaign" data-page-section="campaign">
        <section class="ddc-card">
          <div class="ddc-card-title">
            <span>01</span><strong>AKTA KAMPANII</strong>
          </div>
          <div class="ddc-card-body">
            <div class="ddc-intro-grid">
              <article class="ddc-paper">
                <div class="ddc-section-mark">RAVENLOFT · DARKON</div>
                <h2 id="campaign-intro-title"></h2>
                <div id="campaign-intro-copy"></div>
              </article>
              <aside class="ddc-case" aria-label="Dossier kampanii">
                <div class="ddc-case-label">DOSSIER</div>
                <div id="campaign-dossier"></div>
              </aside>
            </div>
          </div>
        </section>
        <section class="ddc-party-portrait">
          <div class="ddc-party-copy">
            <div class="ddc-section-mark">ARCHIWUM</div>
            <h2 id="party-title"></h2>
            <p id="party-description"></p>
          </div>
          <figure class="ddc-party-image">
            <img id="party-image" alt="Sons of Azalin" loading="lazy" />
          </figure>
        </section>
      </section>
      <section
        class="ddc-tab-panel"
        id="characters"
        data-page-section="characters"
        hidden
      >
        <section class="ddc-section ddc-character-intro">
          <div class="ddc-section-mark" id="characters-kicker"></div>
          <h2 id="characters-title"></h2>
          <p id="characters-description"></p>
        </section>
        <div id="character-gallery" aria-live="polite"></div>
      </section>
      <section
        class="ddc-tab-panel ddc-chronicle-panel"
        id="chronicle"
        data-page-section="chronicle"
        hidden
      >
        <section class="ddc-section ddc-chronicle-intro">
          <div class="ddc-section-mark" id="chronicle-kicker"></div>
          <h2 id="chronicle-title"></h2>
          <p id="chronicle-description"></p>
        </section>
        <section class="ddc-section ddc-chronicle-records">
          <div id="campaign-chronicle" class="chronicle"></div>
        </section>
      </section>
    </main>
    <footer class="ddc-footer">
      <span>VENGRATH · SONS OF AZALIN</span>
      <a href="#campaign-hero">POWRÓT NA GÓRĘ ↑</a>
    </footer>
    <script type="module" src="./app.js"></script>
  </body>
</html>
