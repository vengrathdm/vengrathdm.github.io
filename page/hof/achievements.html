<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c0a11">
  <meta
    name="description"
    content="Katalog odznaczeń Archiwum Postaci Vengrath."
  >
  <title>Katalog Odznaczeń — Archiwum Postaci — Vengrath</title>

  <link rel="icon" href="/core/graphics/favicon/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Voltaire&family=Fira+Sans+Extra+Condensed:ital,wght@0,400;0,500;0,600;1,400&family=Cutive+Mono&display=swap"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="/page/hof/styles.css">
  <link rel="stylesheet" href="/page/hof/achievements.css">
  <link rel="stylesheet" href="/core/templates/Cursor/Cursor.css">
</head>
<body>
  <header class="hof-hero">
    <nav class="hof-nav">
      <a class="hof-brand" href="/home/" aria-label="Vengrath — strona główna">
        <img src="/core/graphics/favicon/mg-logo.png" alt="">
        <span>VENGRATH</span>
      </a>

      <div class="hof-nav-meta">ARCHIWUM <span>/</span> ODZNACZENIA</div>
      <a class="hof-nav-link" href="/page/hof/">ARCHIWUM POSTACI</a>
      <a class="hof-nav-link" href="/page/hof/lab/voronoi/">VORONOI</a>
      <a class="hof-nav-link" href="/home/">STRONA GŁÓWNA</a>
    </nav>

    <div class="hof-hero-copy">
      <div class="hof-title-group">
        <h1>KATALOG <span>ODZNACZEŃ</span></h1>
        <span class="hof-red-motif" aria-hidden="true"></span>
      </div>
    </div>
  </header>

  <main class="achievement-main">
    <section class="achievement-tools" aria-label="Wyszukiwanie odznaczeń">
      <label class="achievement-search">
        <span aria-hidden="true">⌕</span>
        <input
          id="achievementSearch"
          type="search"
          placeholder="Szukaj odznaczenia…"
          aria-label="Szukaj odznaczenia"
        >
      </label>

      <label class="achievement-category">
        KATEGORIA
        <select id="categoryFilter" aria-label="Filtr kategorii">
          <option value="">Wszystkie kategorie</option>
        </select>
      </label>
    </section>

    <div class="hof-results-heading">
      <h2>REJESTR ODZNACZEŃ</h2>
      <span id="achievementCount">ŁADOWANIE…</span>
    </div>

    <div id="achievementGrid" class="achievement-catalogue"></div>

    <p id="achievementEmpty" class="message" hidden>
      Nie znaleziono odznaczeń dla wybranych kryteriów.
    </p>
    <p id="achievementError" class="message" hidden>
      Nie udało się wczytać katalogu odznaczeń.
    </p>
  </main>

  <footer class="hof-footer">
    <a href="/page/hof/">← ARCHIWUM POSTACI</a>
    <span>VENGRATH / KATALOG ODZNACZEŃ</span>
    <a href="/page/hof/lab/voronoi/">VORONOI →</a>
  </footer>

  <script type="module" src="/page/hof/achievements.js"></script>
</body>
</html>
