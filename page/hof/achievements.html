<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="Katalog odznaczeń przyznawanych bohaterom kampanii Vengrath."
    />
    <meta name="theme-color" content="#100e0c" />
    <title>Katalog odznaczeń — Sala Chwały — Vengrath</title>
    <link rel="icon" href="/core/graphics/favicon/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Voltaire&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/page/hof/hof.css" />
    <link
      rel="stylesheet"
      href="/core/templates/CharacterCard/CharacterCard.css"
    />
    <link
      rel="stylesheet"
      href="/core/templates/CharacterCard/Achievements/Achievements.css"
    />
  </head>
  <body>
    <header class="hof-hero">
      <nav class="hof-nav">
        <a class="hof-brand" href="/home/" aria-label="Vengrath — strona główna">
          <img src="/core/graphics/favicon/mg-logo.png" alt="" />
          <span>VENGRATH</span>
        </a>
        <div class="hof-nav-meta">ARCHIWUM <span>/</span> ODZNACZENIA</div>
        <a class="hof-nav-link" href="/page/hof/">SALA CHWAŁY</a>
        <a class="hof-nav-link" href="/home/">STRONA GŁÓWNA</a>
      </nav>
      <div class="hof-hero-copy">
        <p>SALA CHWAŁY · WYRÓŻNIENIA</p>
        <h1>KATALOG <span>ODZNACZEŃ</span></h1>
      </div>
    </header>
    <main class="achievement-main">
      <div class="achievement-tools">
        <input
          id="achievementSearch"
          type="search"
          placeholder="Szukaj osiągnięcia…"
          aria-label="Szukaj osiągnięcia"
        /><select id="categoryFilter" aria-label="Filtr kategorii">
          <option value="">Wszystkie kategorie</option>
        </select>
      </div>
      <div class="hof-results-heading">
        <h2>Odznaczenia</h2>
        <span id="achievementCount">ŁADOWANIE…</span>
      </div>
      <div id="achievementGrid" class="achievement-catalogue"></div>
      <p id="achievementEmpty" class="hof-empty" hidden>
        Nie znaleziono osiągnięć dla wybranych kryteriów.
      </p>
      <p id="achievementError" class="hof-empty" hidden>
        Nie udało się wczytać katalogu osiągnięć.
      </p>
    </main>
    <footer class="hof-footer">
      <a href="/page/hof/">SALA CHWAŁY →</a>
      <span>VENGRATH / KATALOG ODZNACZEŃ</span>
      <a href="/home/">STRONA GŁÓWNA →</a>
    </footer>
    <script type="module" src="/page/hof/achievements.js"></script>
  </body>
</html>
