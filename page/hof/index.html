<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="Sala Chwały Vengrath — bohaterowie, historie i osiągnięcia z kampanii."
    />
    <meta name="theme-color" content="#100e0c" />
    <title>Sala Chwały — Vengrath</title>
    <link rel="icon" href="/core/graphics/favicon/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Voltaire&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/page/hof/hof.css" />
    <link
      rel="stylesheet"
      href="/core/templates/CharacterCard/CharacterCard.css"
    />
    <link
      rel="stylesheet"
      href="/core/templates/CharacterCard/Achievements/Achievements.css"
    />
  </head>
  <body>
    <header class="hof-hero">
      <nav class="hof-nav">
        <a class="hof-brand" href="/home/" aria-label="Vengrath — strona główna">
          <img src="/core/graphics/favicon/mg-logo.png" alt="" />
          <span>VENGRATH</span>
        </a>
        <a class="hof-nav-link" href="/page/hof/achievements.html"
          >KATALOG ODZNACZEŃ</a
        >
        <a class="hof-nav-link" href="/home/">STRONA GŁÓWNA</a>
      </nav>
      <div class="hof-hero-copy">
        <h1>SALA <span>CHWAŁY</span></h1>
      </div>
    </header>
    <main class="hof-main">
      <section class="hof-stats">
        <div><span>POSTACIE</span><strong id="statCharacters">—</strong></div>
        <div><span>GRACZE</span><strong id="statPlayers">—</strong></div>
        <div><span>KAMPANIE</span><strong id="statCampaigns">—</strong></div>
        <div><span>AKTYWNE</span><strong id="statActive">—</strong></div>
        <div><span>ZWYCIĘSKIE</span><strong id="statWinning">—</strong></div>
      </section>
      <section class="hof-archive">
        <aside class="hof-filters" aria-label="Filtry galerii postaci">
          <label class="hof-search">
            <span aria-hidden="true">⌕</span>
            <input
              id="search"
              type="search"
              placeholder="Szukaj…"
              aria-label="Szukaj postaci lub gracza"
            />
          </label>
          <div class="hof-filter-grid">
            <label>
              GRACZ
              <select id="playerFilter">
                <option value="">Wszyscy</option>
              </select>
            </label>
            <label>
              KAMPANIA
              <select id="campaignFilter">
                <option value="">Wszystkie</option>
              </select>
            </label>
            <label>
              MODUŁ
              <select id="moduleFilter">
                <option value="">Wszystkie</option>
              </select>
            </label>
            <label>
              KLASA
              <select id="classFilter">
                <option value="">Wszystkie</option>
              </select>
            </label>
            <label>
              RASA
              <select id="raceFilter">
                <option value="">Wszystkie</option>
              </select>
            </label>
            <label>
              ODZNACZENIE
              <select id="achievementFilter">
                <option value="">Wszystkie</option>
              </select>
            </label>
            <label>
              STATUS
              <select id="statusFilter">
                <option value="">Wszystkie</option>
              </select>
            </label>
          </div>
          <button id="clearFilters" class="hof-reset" type="button">
            WYCZYŚĆ FILTRY
          </button>
        </aside>
        <section class="hof-results" aria-label="Galeria postaci">
          <div class="hof-results-heading">
            <h2 class="hof-visually-hidden">Postacie</h2>
            <span id="resultCount">ŁADOWANIE…</span>
          </div>
          <div id="grid" class="character-gallery" aria-live="polite"></div>
          <p id="empty" class="hof-empty" hidden>
            Nie znaleziono postaci dla wybranych kryteriów.
          </p>
          <p id="loadError" class="hof-empty" hidden>
            Nie udało się wczytać archiwum.
          </p>
        </section>
      </section>
    </main>
    <footer class="hof-footer">
      <a href="/page/hof/achievements.html">KATALOG ODZNACZEŃ →</a>
      <span>VENGRATH / SALA CHWAŁY</span>
      <a href="/home/">STRONA GŁÓWNA →</a>
    </footer>
    <dialog id="characterDialog" class="character-dialog">
      <button
        id="modalClose"
        class="dialog-close"
        type="button"
        aria-label="Zamknij"
      >
        ×
      </button>
      <div id="modalContent"></div>
    </dialog>
    <script type="module" src="/page/hof/hof.js"></script>
  </body>
</html>
