<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delilah Brooke — Karta postaci</title>
<!-- Fonty są opcjonalne: bez internetu działają zapasowe (Arial Narrow / Courier New). -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Voltaire&family=Fira+Sans+Extra+Condensed:ital,wght@0,400;0,500;0,600;1,400&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ===== TOKENY — zmień --stamp i --amber, by nadać postaci własny kolor ===== */
:root{
  --soot:#1a1714;--carbon:#241f2e;--carbon-hi:#3a3448;
  --paper:#ece4cf;--paper-shade:#d9cdac;--kraft:#a8875a;
  --ink:#2a2620;--ink-fade:#55503f;
  --stamp:#8b2020;--stamp-dim:#6e1a1a;--amber:#d4a03c;--navy:#281e5d;--gold:#b08d57;--verdigris:#47695e;
  --display:Voltaire,"Arial Narrow",sans-serif;
  --body:"Fira Sans Extra Condensed","Arial Narrow",sans-serif;
  --type:"Courier Prime","Courier New",monospace;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--ink);font:17px/1.55 var(--body);
  background:radial-gradient(ellipse 1000px 600px at 50% -10%,#2c2620,transparent 60%),linear-gradient(180deg,var(--soot),#100e0b);
  padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0;z-index:400;pointer-events:none;opacity:.35;mix-blend-mode:multiply;
  background:radial-gradient(circle at 15% 20%,rgba(0,0,0,.08),transparent 40%),radial-gradient(circle at 85% 80%,rgba(0,0,0,.1),transparent 45%),repeating-linear-gradient(0deg,rgba(0,0,0,.015) 0 1px,transparent 1px 3px)}
::selection{background:var(--stamp);color:#f5ece0}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
h1,h2,h3,h4{margin:0;font-family:var(--display);font-weight:400}
button{font:inherit;color:inherit}

/* ===== SZKIELET: karbonowa szyna z pionowymi zakładkami ===== */
.shell{display:flex;min-height:100vh;position:relative;z-index:1}
.rail{width:104px;flex:none;position:sticky;top:0;height:100vh;background:var(--carbon);display:flex;flex-direction:column;align-items:center;padding:26px 0 18px}
.badge{width:54px;height:54px;border:2px solid var(--amber);border-radius:50%;display:grid;place-items:center;color:var(--amber);font:11px/1.1 var(--display);margin-bottom:24px;flex:none}
.tablist{display:flex;flex-direction:column;gap:5px;width:100%;flex:1;min-height:0;overflow:hidden auto}
.tab{writing-mode:vertical-rl;background:none;border:0;color:#8b8496;font:13px var(--display);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;width:100%;height:112px;flex:0 0 112px;display:flex;align-items:center;justify-content:center;position:relative;transition:color .15s,background .15s}
.tab span{transform:rotate(180deg)}
.tab:hover{color:#e8e1d0;background:rgba(255,255,255,.04)}
.tab[aria-selected=true]{color:var(--paper);background:var(--stamp)}
.tab[aria-selected=true]::after{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--amber)}
.rail-foot{writing-mode:vertical-rl;color:#5e576b;font:9.5px var(--type);letter-spacing:.1em;padding-top:14px}
.rail-foot span{display:inline-block;transform:rotate(180deg)}
main{flex:1;min-width:0;width:min(100%,1240px);margin-inline:auto;padding:46px clamp(18px,4vw,64px) 100px}

/* ===== PASEK AKT + PRZEŁĄCZNIKI ===== */
.strip{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;border-bottom:2px solid #f1f1ee;padding-bottom:10px;margin-bottom:34px;font:12px var(--display);letter-spacing:.08em;color:#a89fb8}
.strip b{color:#e0675f;font-weight:400}
.switch{display:inline-flex;align-items:center;gap:9px;padding:7px 14px;background:linear-gradient(180deg,var(--carbon-hi),var(--carbon));border:1px solid rgba(176,141,87,.5);cursor:pointer;font:12px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--paper)}
.switch i{width:8px;height:8px;background:var(--stamp);transform:rotate(45deg);box-shadow:0 0 6px rgba(139,32,32,.8)}
.switch[aria-pressed=true] i{background:var(--amber);box-shadow:0 0 8px rgba(212,160,60,.7)}
.switch:hover{border-color:var(--gold)}

/* ===== BOHATER: zdjęcie z miarką wzrostu + dane ===== */
.hero{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:clamp(24px,4vw,56px);align-items:start}
.mugwrap{position:relative}
.mug{position:relative;display:block;aspect-ratio:3/4;overflow:hidden;cursor:pointer;border:2px solid var(--ink);box-shadow:5px 5px 0 rgba(0,0,0,.55);background:linear-gradient(135deg,var(--carbon-hi),var(--soot))}
.mug img{width:100%;height:100%;object-fit:cover;display:block}
.mug img[hidden]{display:none}
.mug::before{content:"";position:absolute;inset:0 auto 0 0;width:14px;z-index:2;border-right:1px solid rgba(236,228,207,.3);
  background:repeating-linear-gradient(180deg,rgba(236,228,207,.8) 0 1px,transparent 1px 60px) left/14px 100% no-repeat,repeating-linear-gradient(180deg,rgba(236,228,207,.5) 0 1px,transparent 1px 12px) left/7px 100% no-repeat}
.mug::after{content:"";position:absolute;inset:12px 12px 12px 26px;border:1px dashed rgba(241,241,238,.28);pointer-events:none}
.mug .ph{position:absolute;inset:0;display:grid;place-items:center;padding:0 30px;text-align:center;font:11px var(--display);letter-spacing:.12em;color:#aaa59a}
.mug .plate{position:absolute;left:22px;right:8px;bottom:8px;z-index:3;padding:4px 8px;background:rgba(0,0,0,.6);font:11px var(--type);letter-spacing:.08em;color:#c9c2b4}
.mug input{position:absolute;opacity:0;pointer-events:none}
.mug:focus-within{outline:2px solid var(--amber);outline-offset:3px}
.stamp{position:absolute;right:-14px;top:22px;z-index:4;padding:6px 14px;border:3px solid var(--stamp);background:rgba(236,228,207,.94);color:var(--stamp);font:800 13px var(--display);letter-spacing:2px;text-transform:uppercase;transform:rotate(-6deg)}
.kicker{margin:0 0 8px;font:13px var(--display);letter-spacing:.14em;color:var(--amber)}
h1{font-size:clamp(44px,6.4vw,88px);line-height:.95;color:#f1f1ee;letter-spacing:-.5px;overflow-wrap:anywhere}
.sub{margin:12px 0 0;max-width:52ch;font-style:italic;font-size:19px;color:#b9b2a4}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0 0;padding:0;list-style:none}
.tag{padding:3px 11px 4px;font:11px var(--type);letter-spacing:1px;text-transform:uppercase;color:#f1e6d2;background:var(--navy);box-shadow:inset 0 0 0 1px rgba(216,184,126,.45)}
.tag.red{background:var(--stamp)}
.facts{position:relative;margin-top:30px;max-width:520px;padding:22px 22px 12px;background:var(--carbon);color:var(--paper);box-shadow:0 16px 34px rgba(0,0,0,.5)}
.facts h3{margin-bottom:8px;font-size:13px;letter-spacing:.1em;color:var(--amber)}
.fact{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.09);font-size:15px}
.fact:last-child{border:0}
.fact span:first-child{color:#a89fb8}
.fact span:last-child{text-align:right;font-weight:500}

/* ===== PASEK STATYSTYK ===== */
.vitals{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:14px;margin:40px 0 30px}
.vital{padding:14px 12px 12px;text-align:center;background:var(--paper);border:2px solid var(--ink);box-shadow:4px 4px 0 rgba(0,0,0,.55)}
.vital .n{display:block;font:700 30px/1.1 var(--type);color:var(--ink)}
.vital .l{display:block;margin-top:4px;font-size:13.5px;color:var(--ink-fade)}
.vital.hp{grid-column:span 2}
.vital.hp .n.low{color:var(--stamp)}
.hpctl{display:flex;justify-content:center;align-items:center;gap:14px}
.hpctl button{width:32px;height:32px;border:1.5px solid var(--ink);background:none;font:700 18px var(--type);cursor:pointer}
.hpctl button:hover{background:var(--ink);color:var(--paper)}
.hpctl .n{min-width:5ch}

/* ===== ARKUSZ PERGAMINU (zakładki) ===== */
.sheet{padding:clamp(22px,3vw,46px) clamp(18px,3vw,52px) 42px;background-color:var(--paper);
  background-image:repeating-linear-gradient(0deg,rgba(120,90,50,.045) 0 2px,transparent 2px 4px),radial-gradient(90% 60% at 80% 0,rgba(255,255,255,.45),transparent 60%);
  outline:1px solid var(--gold);outline-offset:5px;border:1px solid var(--navy);box-shadow:0 0 0 6px var(--paper-shade),0 22px 50px rgba(0,0,0,.65)}
.panel{animation:in .35s ease both}
.panel[hidden]{display:none}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sheet h2{font-size:clamp(28px,3.4vw,40px);text-transform:uppercase;letter-spacing:1px;color:var(--stamp)}
.sheet h3{margin:32px 0 10px;padding-bottom:5px;font-size:22px;letter-spacing:2px;text-transform:uppercase;color:var(--stamp);border-bottom:3px double rgba(139,32,32,.35)}
.sheet h3::before{content:"◆";font-size:9px;margin-right:10px;vertical-align:middle;opacity:.7}
.lede{margin:6px 0 0;font-style:italic;color:var(--ink-fade)}
.lead{margin:18px 0 0;padding-top:16px;border-top:3px double var(--stamp);font-size:19px;line-height:1.55}
.lead::first-letter{float:left;margin:7px 10px 0 0;font:54px/.76 var(--display);color:var(--stamp)}
.sheet p{margin:0 0 11px;max-width:74ch}
.sheet p+p{text-indent:1.1em}
.cols{display:grid;grid-template-columns:1.15fr .85fr;gap:clamp(24px,4vw,52px)}
.quote{margin:0 0 14px;padding:4px 0 4px 16px;border-left:3px double var(--stamp);font-style:italic;color:var(--ink-fade)}
.kv{border-top:3px double rgba(139,32,32,.35);margin:14px 0 20px}
.kv div{display:grid;grid-template-columns:minmax(120px,22%) 1fr;gap:4px 18px;padding:8px 0;border-bottom:1px dotted rgba(139,32,32,.35)}
.kv dt{font:12px var(--type);letter-spacing:1px;text-transform:uppercase;color:var(--ink-fade);padding-top:3px}
.kv dd{margin:0}
.chip{display:inline-block;margin:0 4px 6px 0;padding:3px 11px 4px;font-size:14px;color:var(--navy);background:rgba(40,30,93,.07);border:1px solid rgba(40,30,93,.4)}
.aside{margin:22px 0;padding:15px 18px 16px;border:1px solid var(--stamp);box-shadow:inset 0 0 0 3px rgba(236,228,207,.55);background:rgba(201,188,164,.5)}
.aside h4{margin-bottom:6px;font-size:15px;letter-spacing:2px;text-transform:uppercase;color:var(--stamp)}
.aside p:last-child{margin:0}
.secret{margin:18px 0;padding:12px 16px;color:#ebe5f7;background:var(--navy);border:1px solid var(--gold);box-shadow:inset 0 0 0 3px rgba(176,141,87,.22)}
.secret h4{margin-bottom:5px;font-size:15px;letter-spacing:2px;text-transform:uppercase;color:#d8b87e}
.secret p{margin:0}
body.hide-gm .secret{display:none}

/* cechy */
.abil{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:22px 0 30px}
.ab{padding:14px 6px 12px;text-align:center;background:var(--carbon);color:var(--paper);box-shadow:inset 0 0 0 3px rgba(176,141,87,.12)}
.ab b{display:block;font:12px var(--display);letter-spacing:.08em;color:var(--amber);font-weight:400}
.ab .s{display:block;font:700 28px/1.2 var(--type)}
.ab .m{font:15px var(--type);color:#a89fb8}
.ab .m em{font-style:normal;color:var(--amber)}
.skills{display:grid;grid-template-columns:1fr 1fr;gap:0 40px}
table{width:100%;border-collapse:collapse;font-size:16px}
td{padding:7px 8px;border-bottom:1px dotted rgba(139,32,32,.35)}
td.m{text-align:right;font:700 15px var(--type)}
tr:nth-child(odd){background:rgba(40,30,93,.06)}
.dot{display:inline-block;width:8px;height:8px;margin-right:10px;border:1px solid var(--ink-fade);transform:rotate(45deg)}
.p1 .dot,.p2 .dot{background:var(--stamp);border-color:var(--stamp)}
.p2 .dot{box-shadow:0 0 0 2px var(--paper),0 0 0 3px var(--stamp)}

/* zdolności (akordeon) */
.feat{border-top:1px solid rgba(139,32,32,.35)}
.fi{border-bottom:1px solid rgba(139,32,32,.35)}
.fh{width:100%;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 4px;background:none;border:0;text-align:left;cursor:pointer}
.fh strong{display:block;font:400 20px var(--display);color:var(--ink)}
.fh small{font:12px var(--type);color:var(--ink-fade);letter-spacing:.5px}
.fh i{font:normal 22px var(--type);color:var(--stamp);transition:transform .3s}
.fi.open .fh i{transform:rotate(45deg)}
.fb{display:none;padding:0 4px 18px}
.fi.open .fb{display:block}

/* zaklęcia i sloty */
.dcs{display:flex;flex-wrap:wrap;gap:12px 36px;margin:22px 0 4px}
.dcs .n{font:700 34px/1 var(--type);color:var(--stamp)}
.dcs .l{font-size:14px;color:var(--ink-fade)}
.pips{display:flex;gap:8px;margin-top:8px}
.pip{width:20px;height:20px;border:2px solid var(--stamp);background:var(--stamp);transform:rotate(45deg) scale(.8);cursor:pointer;padding:0}
.pip[aria-pressed=true]{background:none}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{padding:16px 18px;background:var(--paper);border:2px solid var(--ink);box-shadow:4px 4px 0 rgba(20,17,14,.5)}
.card h4{font-size:19px;color:var(--ink)}
.card .meta{margin:3px 0 8px;font:12px var(--type);color:var(--stamp)}
.card p{margin:0;font-size:15.5px}

/* ekwipunek */
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1px;background:rgba(139,32,32,.35);border:1px solid rgba(139,32,32,.35)}
.it{padding:12px 14px;background:var(--paper)}
.it div{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.it strong{font:400 17px var(--display)}
.it em{font:12px var(--type);color:var(--stamp);font-style:normal;white-space:nowrap}
.it p{margin:4px 0 0;font-size:14.5px;color:var(--ink-fade)}
.it small{font:italic 13px var(--body);color:var(--ink-fade)}

footer{margin-top:44px;text-align:center;font:12px var(--type);letter-spacing:.06em;color:#6f6579}

/* ===== MNIEJSZE EKRANY ===== */
@media(max-width:900px){
  .shell{flex-direction:column}
  .rail{width:100%;height:auto;flex-direction:row;padding:0;position:sticky;top:0;z-index:30;padding-top:env(safe-area-inset-top,0px)}
  .badge,.rail-foot{display:none}
  .tablist{flex-direction:row;overflow:auto hidden}
  .tab{writing-mode:horizontal-tb;height:auto;flex:0 0 auto;width:auto;padding:16px 18px}
  .tab span{transform:none}
  .tab[aria-selected=true]::after{inset:auto 0 0 0;width:auto;height:4px}
  .hero,.cols,.skills{grid-template-columns:1fr}
  .mugwrap{max-width:270px}
  .abil{grid-template-columns:repeat(3,1fr)}
  .kv div{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== KURSOR HEARTWELL (romb) — tylko dla myszy ===== */
@media(hover:hover) and (pointer:fine) and (prefers-reduced-motion:no-preference){
  body.ksiazeta-heartwell-page,body.ksiazeta-heartwell-page *{cursor:none!important}
  .hw-cursor{position:fixed;top:0;left:0;z-index:2147483647;width:28px;height:28px;pointer-events:none;opacity:0;transition:opacity .12s,width .14s,height .14s}
  .hw-cursor::before,.hw-cursor::after{content:"";position:absolute;inset:3px;border:1px solid var(--amber);transform:rotate(45deg);box-shadow:0 0 7px rgba(212,160,60,.28)}
  .hw-cursor::after{inset:11px;border:0;background:var(--stamp);box-shadow:0 0 0 1px var(--amber)}
  .hw-cursor.on{opacity:1}.hw-cursor.hov{width:38px;height:38px}.hw-cursor.dn{width:22px;height:22px}
}

/* ===== DRUK — tylko arkusz i karta ===== */
@media print{
  body{background:#fff}body::before,.rail,.strip .switch,.hw-cursor,footer{display:none!important}
  .shell{display:block}main{padding:0;width:100%}h1,.sub,.kicker{color:#000}
  .panel[hidden]{display:block}.fb{display:block}.sheet{box-shadow:none;outline:0}
}
</style>
</head>
<body class="ksiazeta-heartwell-page">
<div class="shell">
  <nav class="rail" aria-label="Sekcje karty postaci">
    <div class="badge" id="badge">HW</div>
    <div class="tablist" id="tabs" role="tablist" aria-orientation="vertical"></div>
    <div class="rail-foot"><span>KARTA POSTACI</span></div>
  </nav>

  <main>
    <div class="strip">
      <span>AKTA POSTACI · HEARTWELL <b id="caseNo"></b></span>
      <button class="switch" id="gm" type="button" aria-pressed="true"><i></i>Notatki MG</button>
    </div>

    <section class="hero">
      <div class="mugwrap">
        <label class="mug" title="Kliknij, by wczytać portret z dysku">
          <img id="portrait" alt="Portret postaci" hidden>
          <span class="ph" id="ph">Kliknij, by wczytać portret</span>
          <span class="plate" id="plate"></span>
          <input type="file" id="file" accept="image/*">
        </label>
        <div class="stamp" id="stamp"></div>
      </div>
      <div>
        <p class="kicker" id="kicker"></p>
        <h1 id="name"></h1>
        <p class="sub" id="sub"></p>
        <ul class="tags" id="tags"></ul>
        <div class="facts"><h3>Dane postaci</h3><div id="facts"></div></div>
      </div>
    </section>

    <div class="vitals" id="vitals"></div>

    <div class="sheet">
      <section class="panel" id="p-akta" role="tabpanel" hidden></section>
      <section class="panel" id="p-cechy" role="tabpanel" hidden></section>
      <section class="panel" id="p-dary" role="tabpanel" hidden></section>
      <section class="panel" id="p-czary" role="tabpanel" hidden></section>
      <section class="panel" id="p-sprzet" role="tabpanel" hidden></section>
    </div>
    <footer>Karta sporządzona na potrzeby kampanii Książęta Heartwell</footer>
  </main>
</div>

<script>
/* =====================================================================
   DANE POSTACI — edytuj tylko ten obiekt. Reszta karty buduje się sama.
   Modyfikatory, biegłości, KT czarów i Percepcja Bierna liczą się z danych.
   ===================================================================== */
const C = {
  "name": "Delilah Brooke",
  "kicker": "Rogue 2 / Ranger 1",
  "sub": "Łowczyni, która zna miejskie zaułki, ich ukryte ścieżki i niebezpieczeństwa kryjące się tuż poza zasięgiem latarni.",
  "player": "Wpoluwiatr",
  "caseNo": "HW-PC-03",

/* ===== Poniżej silnik karty — zwykle nie trzeba go zmieniać ===== */
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const sgn = (n) => (n >= 0 ? "+" : "−") + Math.abs(n);
  const KEY = "hwCard:" + C.caseNo;
  let S = { hp: C.hp, used: {}, gm: true };
  try { S = Object.assign(S, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

  const AB = { str: "Siła", dex: "Zręczność", con: "Kondycja", int: "Inteligencja", wis: "Mądrość", cha: "Charyzma" };
  const SK = [["Akrobatyka", "dex"], ["Atletyka", "str"], ["Arkana", "int"], ["Dochodzenie", "int"], ["Historia", "int"], ["Medycyna", "wis"], ["Natura", "int"], ["Obchodzenie ze zwierzętami", "wis"], ["Oszustwo", "cha"], ["Percepcja", "wis"], ["Perswazja", "cha"], ["Przetrwanie", "wis"], ["Religia", "int"], ["Skradanie", "dex"], ["Występy", "cha"], ["Wyczucie", "wis"], ["Zastraszanie", "cha"], ["Zręczne dłonie", "dex"]];
  const mod = (k) => Math.floor((C.abilities[k] - 10) / 2);
  const prof = Math.ceil(C.level / 4) + 1;
  const skill = (n, a) => mod(a) + prof * (C.skillProf[n] || 0) + (C.jat && !C.skillProf[n] ? Math.floor(prof / 2) : 0);

  /* nagłówek */
  document.title = C.name + " — Karta postaci";
  $("badge").textContent = C.initials; $("caseNo").textContent = "· " + C.caseNo;
  $("name").textContent = C.name; $("kicker").textContent = C.kicker; $("sub").textContent = C.sub;
  $("stamp").textContent = C.stamp; $("plate").textContent = C.caseNo + " · " + C.player;
  $("tags").innerHTML = C.tags.map(([t, k]) => `<li class="tag ${k || ""}">${esc(t)}</li>`).join("");
  $("facts").innerHTML = C.facts.map(([k, v]) => `<div class="fact"><span>${esc(k)}</span><span>${esc(v)}</span></div>`).join("");

  /* portret z dysku */
  function showImg(src) { $("portrait").src = src; $("portrait").hidden = false; $("ph").hidden = true; }
  if (C.portrait) showImg(C.portrait);
  $("file").addEventListener("change", (e) => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader(); r.onload = () => showImg(r.result); r.readAsDataURL(f);
  });

  /* pasek statystyk (PŻ klikane, zapamiętywane w przeglądarce) */
  const pw = 10 + skill("Percepcja", "wis");
  function vitals() {
    const low = S.hp <= C.hp / 4 ? " low" : "";
    $("vitals").innerHTML =
      `<div class="vital hp"><div class="hpctl"><button data-hp="-1" aria-label="Odejmij punkt życia">−</button><span class="n${low}" aria-live="polite">${S.hp}/${C.hp}</span><button data-hp="1" aria-label="Dodaj punkt życia">+</button></div><span class="l">Punkty Życia</span></div>` +
      [[C.ac, "Klasa Pancerza"], [C.speed, "Szybkość"], [sgn(mod("dex")), "Inicjatywa"], [sgn(prof), "Biegłość"], [pw, "Percepcja Bierna"]]
        .map(([n, l]) => `<div class="vital"><span class="n">${esc(n)}</span><span class="l">${l}</span></div>`).join("");
  }
  $("vitals").addEventListener("click", (e) => {
    const b = e.target.closest("[data-hp]"); if (!b) return;
    S.hp = Math.max(0, Math.min(C.hp, S.hp + +b.dataset.hp)); save(); vitals();
  });
  vitals();

  /* Akta */
  const L = C.lore;
  $("p-akta").innerHTML = `<h2>Akta osoby</h2><p class="lede">Kim jest, skąd przychodzi i co za nią chodzi.</p>
    <p class="lead">${esc(L.lead)}</p>
    <div class="cols"><div>${L.paragraphs.map((p) => `<p>${esc(p)}</p>`).join("")}
      <h3>Szczegóły</h3><dl class="kv">${L.details.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl></div>
      <div><p class="quote">${esc(L.quote)}</p>
        <div class="aside"><h4>Głos i maniery</h4>${L.voice.map((v) => `<p>${esc(v)}</p>`).join("")}</div>
        <h3>Języki</h3><p>${L.languages.map((l) => `<span class="chip">${esc(l)}</span>`).join("")}</p>
        ${L.gm.map((g) => `<div class="secret"><h4>${esc(g.label)}</h4><p>${esc(g.text)}</p></div>`).join("")}</div></div>`;

  /* Cechy */
  const half = Math.ceil(SK.length / 2);
  const rows = (arr) => `<table><tbody>${arr.map(([n, a]) => `<tr class="p${C.skillProf[n] || 0}"><td><span class="dot"></span>${n}</td><td class="m">${sgn(skill(n, a))}</td></tr>`).join("")}</tbody></table>`;
  $("p-cechy").innerHTML = `<h2>Cechy i biegłości</h2><p class="lede">Rzuty obronne i umiejętności liczą się z poziomu i cech.</p>
    <div class="abil">${Object.keys(AB).map((k) => `<div class="ab"><b>${AB[k]}</b><span class="s">${C.abilities[k]}</span><span class="m">${sgn(mod(k))}${C.saves.includes(k) ? ` <em>· rzut ${sgn(mod(k) + prof)}</em>` : ""}</span></div>`).join("")}</div>
    <div class="skills">${rows(SK.slice(0, half))}${rows(SK.slice(half))}</div>`;

  /* Zdolności (akordeon) */
  $("p-dary").innerHTML = `<h2>Zdolności i talenty</h2><p class="lede">Kliknij, by rozwinąć opis.</p><div class="feat" style="margin-top:20px">${C.features.map((f, i) =>
    `<div class="fi"><button class="fh" aria-expanded="false" aria-controls="fb${i}"><span><strong>${esc(f.name)}</strong><small>${esc(f.tag)}</small></span><i aria-hidden="true">+</i></button><div class="fb" id="fb${i}">${f.body.map((p) => `<p>${esc(p)}</p>`).join("")}</div></div>`).join("")}</div>`;
  $("p-dary").addEventListener("click", (e) => {
    const b = e.target.closest(".fh"); if (!b) return;
    const o = b.parentElement.classList.toggle("open"); b.setAttribute("aria-expanded", o);
  });

  /* Zaklęcia + sloty (pomijane, gdy postać nie ma czarów) */
  if (C.spells.length) {
  const sa = mod(C.spellAbility);
  function slots() {
    return Object.entries(C.slots).map(([lv, n]) => `<div><div class="l">Sloty ${lv}. poziomu</div><div class="pips">${Array.from({ length: n }, (_, i) =>
      `<button class="pip" data-lv="${lv}" data-i="${i}" aria-label="Slot ${lv}. poziomu, ${i + 1}" aria-pressed="${i < (S.used[lv] || 0)}"></button>`).join("")}</div></div>`).join("");
  }
  $("p-czary").innerHTML = `<h2>Zaklęcia</h2><p class="lede">Kliknij romb, by zużyć lub odzyskać slot.</p>
    <div class="dcs"><div><div class="n">${8 + prof + sa}</div><div class="l">Trudność rzutu obronnego</div></div><div><div class="n">${sgn(prof + sa)}</div><div class="l">Bonus do ataku czarem</div></div><span id="slots" style="display:flex;gap:36px;flex-wrap:wrap"></span></div>` +
    C.spells.map((g) => `<h3>${esc(g.title)}</h3><div class="cards">${g.list.map((s) => `<div class="card"><h4>${esc(s.name)}</h4><div class="meta">${s.meta.map(esc).join(" / ")}</div><p>${esc(s.desc)}</p></div>`).join("")}</div>`).join("");
  $("slots").innerHTML = slots();
  $("slots").addEventListener("click", (e) => {
    const b = e.target.closest(".pip"); if (!b) return;
    const lv = b.dataset.lv, i = +b.dataset.i, u = S.used[lv] || 0;
    S.used[lv] = i < u ? i : i + 1; save(); $("slots").innerHTML = slots();
  });

  }

  /* Ekwipunek */
  $("p-sprzet").innerHTML = `<h2>Ekwipunek</h2><p class="lede">Wszystko, co postać nosi przy sobie.</p>` + C.inventory.map((g) =>
    `<h3>${esc(g.section)}</h3><div class="inv">${g.items.map((it) => `<div class="it"><div><strong>${esc(it.name)}</strong><em>${esc(it.qty || "")}</em></div>${it.desc ? `<p>${esc(it.desc)}</p>` : ""}${it.props ? `<small>${esc(it.props)}</small>` : ""}</div>`).join("")}</div>`).join("");

  /* Notatki MG */
  function gm(on) { S.gm = on; document.body.classList.toggle("hide-gm", !on); $("gm").setAttribute("aria-pressed", on); save(); }
  $("gm").addEventListener("click", () => gm($("gm").getAttribute("aria-pressed") !== "true"));
  gm(S.gm !== false);

  /* Zakładki */
  const TABS = [["akta", "Akta"], ["cechy", "Cechy"], ["dary", "Zdolności"], ["czary", "Zaklęcia"], ["sprzet", "Ekwipunek"]].filter((t) => t[0] !== "czary" || C.spells.length);
  $("tabs").innerHTML = TABS.map(([id, t]) => `<button class="tab" role="tab" id="t-${id}" aria-controls="p-${id}" data-id="${id}"><span>${t}</span></button>`).join("");
  const btns = [...document.querySelectorAll(".tab")];
  function show(id, focus) {
    if (!TABS.some((t) => t[0] === id)) id = "akta";
    btns.forEach((b) => { const on = b.dataset.id === id; b.setAttribute("aria-selected", on); b.tabIndex = on ? 0 : -1; if (on && focus) b.focus(); });
    TABS.forEach(([k]) => { $("p-" + k).hidden = k !== id; });
    try { history.replaceState(null, "", "#" + id); } catch (e) {}
  }
  btns.forEach((b, i) => {
    b.addEventListener("click", () => show(b.dataset.id));
    b.addEventListener("keydown", (e) => {
      const d = { ArrowDown: 1, ArrowRight: 1, ArrowUp: -1, ArrowLeft: -1 }[e.key]; if (!d) return;
      e.preventDefault(); show(btns[(i + d + btns.length) % btns.length].dataset.id, true);
    });
  });
  show(location.hash.slice(1));

  /* Kursor Heartwell */
  if (matchMedia("(hover:hover) and (pointer:fine) and (prefers-reduced-motion:no-preference)").matches) {
    const c = document.createElement("span"); c.className = "hw-cursor"; c.setAttribute("aria-hidden", "true"); document.body.appendChild(c);
    document.addEventListener("pointermove", (e) => { c.style.transform = `translate3d(${e.clientX}px,${e.clientY}px,0) translate(-50%,-50%)`; c.classList.add("on"); }, { passive: true });
    document.addEventListener("pointerover", (e) => c.classList.toggle("hov", !!e.target.closest("a,button,label,input,[role=tab]")));
    document.addEventListener("pointerdown", () => c.classList.add("dn"));
    document.addEventListener("pointerup", () => c.classList.remove("dn"));
    document.addEventListener("pointerleave", () => c.classList.remove("on"));
  }
})();
</script>
