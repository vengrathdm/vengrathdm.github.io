<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Descent into Avernus — polska makieta kampanii Dungeons & Dragons 5e prowadzącej z Baldur's Gate do piekielnego Avernusa."
    />
    <meta name="theme-color" content="#120a08" />
    <title>Descent into Avernus — Vengrath</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&family=Voltaire&display=swap"
    />
    <link rel="stylesheet" href="./theme-fonts.css" />
    <link
      rel="stylesheet"
      href="/core/templates/HomeButton/HomeButton.css"
    />
    <link
      rel="stylesheet"
      href="/core/templates/SubpageNavbar/SubpageNavbar.css"
    />
    <link
      rel="stylesheet"
      href="/core/templates/SubpageNavbar/NavbarButton/NavbarButton.css"
    />
    <link
      rel="stylesheet"
      href="/core/templates/SubpageHero/SubpageHero.css"
    />
    <link
      rel="stylesheet"
      href="/core/templates/CharacterCard/CharacterCard.css"
    />
    <link
      rel="stylesheet"
      href="/core/templates/CharacterCard/Achievements/Achievements.css"
    />
    <link
      rel="stylesheet"
      href="/core/templates/CharacterGallery/CharacterGallery.css"
    />
    <link
      rel="stylesheet"
      href="/core/templates/Chronicle/ChronicleRecord/ChronicleRecord.css"
    />
    <link
      rel="stylesheet"
      href="/core/templates/Chronicle/PlayRecordingButton/PlayRecordingButton.css"
    />
    <link rel="stylesheet" href="./styles.css" />
    <link
      rel="stylesheet"
      href="/core/templates/CampaignPage/CampaignStartup.css"
    />
  </head>
  <body class="descent-into-avernus-page campaign-startup-loading">
    <header class="subpage-hero fiery-hero" id="campaign-hero">
      <canvas class="embers" aria-hidden="true"></canvas>
      <div class="fiery-navbar-mount"></div>
      <div class="subpage-hero__copy">
        <p class="eyebrow">BALDUR'S GATE · DUNGEONS &amp; DRAGONS 5e</p>
        <h1 id="hero-title">Descent into Avernus</h1>
        <p class="tagline">
          Z cieni Baldur's Gate droga prowadzi wprost na front Krwawej Wojny.
          Każdy pakt ma cenę.
        </p>
        <p class="roll-message">Rzuć k20, zanim złożysz przysięgę</p>
      </div>
    </header>

    <main class="fiery-main">
      <section
        class="fiery-section"
        id="campaign"
        data-page-section="campaign"
        aria-labelledby="campaign-title"
      >
        <div id="campaign-content"></div>
      </section>

      <section
        class="fiery-section"
        id="characters"
        data-page-section="characters"
        aria-labelledby="characters-title"
        hidden
      >
        <div id="characters-content"></div>
      </section>

      <section
        class="fiery-section"
        id="chronicle"
        data-page-section="chronicle"
        aria-labelledby="chronicle-title"
        hidden
      >
        <div id="chronicle-content"></div>
      </section>
    </main>

    <footer class="fiery-footer">
      <span>VENGRATH · DESCENT INTO AVERNUS</span>
      <a href="#campaign-hero">Wróć na górę ↑</a>
    </footer>

    <script type="module" src="./app.js"></script>
  </body>
</html>
