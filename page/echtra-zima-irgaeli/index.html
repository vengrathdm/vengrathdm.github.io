<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Zima Irgaeli — zimowa opowieść o celtyckich legendach, Samhain, Cailleach i Sidhe."
    />
    <meta name="theme-color" content="#080e0b" />
    <title>Echtra — Zima Irgaeli | Vengrath</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Almendra+SC&amp;family=Uncial+Antiqua&amp;family=Fira+Sans+Extra+Condensed:wght@400;500;600;700&amp;family=Brygada+1918:wght@400;500;600;700&amp;family=Voltaire&amp;display=swap"
    />
    <link
      rel="stylesheet"
      href="/core/templates/CampaignPage/CampaignStartup.css"
    />
    <link rel="stylesheet" href="./theme-fonts.css" />
    <link rel="stylesheet" href="/core/templates/HomeButton/HomeButton.css" />
    <link
      rel="stylesheet"
      href="/core/templates/SubpageNavbar/SubpageNavbar.css"
    />
    <link
      rel="stylesheet"
      href="/core/templates/SubpageNavbar/NavbarButton/NavbarButton.css"
    />
    <link
      rel="stylesheet"
      href="/core/templates/SubpageHero/SubpageHero.css"
    />
    <link
      rel="stylesheet"
      href="/core/templates/CharacterCard/CharacterCard.css"
    />
    <link
      rel="stylesheet"
      href="/core/templates/CharacterCard/Achievements/Achievements.css"
    />
    <link
      rel="stylesheet"
      href="/core/templates/CharacterGallery/CharacterGallery.css"
    />
    <link rel="stylesheet" href="/core/templates/Chronicle/Chronicle.css" />
    <link
      rel="stylesheet"
      href="/core/templates/Chronicle/ChronicleRecord/ChronicleRecord.css"
    />
    <link
      rel="stylesheet"
      href="/core/templates/Chronicle/PlayRecordingButton/PlayRecordingButton.css"
    />
    <link
      rel="stylesheet"
      href="/core/templates/AudioPlayerButton/AudioPlayerButton.css"
    />
    <link rel="stylesheet" href="./sections/campaign/campaign.css" />
    <link rel="stylesheet" href="./sections/gallery/gallery.css" />
    <link rel="stylesheet" href="./sections/characters/characters.css" />
    <link rel="stylesheet" href="./sections/chronicle/chronicle.css" />
  </head>
  <body class="echtra-zima-irgaeli-page campaign-startup-loading">
    <header
      class="subpage-hero"
      id="campaign-hero"
      style="--hero-background: url('/core/graphics/voronoi/echtra-zima-irgaeli.webp')"
    >
      <div class="subpage-hero__copy">
        <p class="campaign-startup-kicker">
          D&amp;D · ECHTRA
        </p>
        <h1>
          Echtra — Zima Irgaeli
        </h1>
        <p class="campaign-startup-lead">
          Zima Irgaeli — opowieść o Samhain, Cailleach, Sidhe i drodze ku Krainom Wiecznej Zimy.
        </p>
      </div>
    </header>
    <main class="ddc-content">
      <section class="ddc-tab-panel" id="campaign" data-page-section="campaign">
        <section class="ddc-card">
          <div class="ddc-card-title">
            <span>01</span><strong>AKTA KAMPANII</strong>
          </div>
          <div class="ddc-card-body">
            <div class="ddc-intro-grid">
              <article class="ddc-paper">
                <div class="ddc-section-mark">O KAMPANII</div>
                <h2 id="campaign-intro-title"></h2>
                <div id="campaign-intro-copy"></div>
              </article>
              <aside class="ddc-case" aria-label="Dossier kampanii">
                <div class="ddc-case-label">DOSSIER</div>
                <div id="campaign-dossier"></div>
              </aside>
            </div>
          </div>
        </section>
      </section>
      <section
        class="ddc-tab-panel"
        id="gallery"
        data-page-section="gallery"
        hidden
      >
        <section class="ddc-section ddc-gallery-intro">
          <div class="ddc-section-mark" id="gallery-kicker"></div>
          <h2 id="gallery-title"></h2>
          <p id="gallery-description"></p>
        </section>
        <div
          id="campaign-gallery"
          class="zima-gallery"
          aria-live="polite"
        ></div>
      </section>
      <section
        class="ddc-tab-panel"
        id="characters"
        data-page-section="characters"
        hidden
      >
        <section class="ddc-section ddc-character-intro">
          <div class="ddc-section-mark" id="characters-kicker"></div>
          <h2 id="characters-title"></h2>
          <p id="characters-description"></p>
        </section>
        <div id="character-gallery" aria-live="polite"></div>
      </section>
      <section
        class="ddc-tab-panel ddc-chronicle-panel"
        id="chronicle"
        data-page-section="chronicle"
        hidden
      >
        <section class="ddc-section ddc-chronicle-intro">
          <div class="ddc-section-mark" id="chronicle-kicker"></div>
          <h2 id="chronicle-title"></h2>
          <p id="chronicle-description"></p>
        </section>
        <section class="ddc-section ddc-chronicle-records">
          <div id="campaign-chronicle" class="chronicle"></div>
        </section>
      </section>
    </main>
    <footer class="ddc-footer">
      <span>VENGRATH · ECHTRA — ZIMA IRGAELI</span
      ><a href="#campaign-hero">POWRÓT NA GÓRĘ ↑</a>
    </footer>
    <script type="module" src="./app.js"></script>
  </body>
</html>
