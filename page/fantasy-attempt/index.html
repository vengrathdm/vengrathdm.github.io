<body><div id="root"><div class="boot">WAKING THE WORLD<span>✦</span></div></div>
<script type="module">
import React from 'react';
import {createRoot} from 'react-dom/client';
const response=await fetch('./src/App.tsx');
if(!response.ok)throw new Error('Could not load campaign application');
const source=await response.text();
const compiled=Babel.transform(source,{filename:'App.tsx',presets:[['typescript',{allExtensions:true,isTSX:true}],['react',{runtime:'classic'}]],sourceType:'module'}).code;
const moduleUrl=URL.createObjectURL(new Blob([compiled],{type:'text/javascript'}));
const {default:App}=await import(moduleUrl);
createRoot(document.getElementById('root')).render(React.createElement(App));
</script></body></html>
