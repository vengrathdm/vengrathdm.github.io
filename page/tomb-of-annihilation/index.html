      content="Wyprawa przez dżunglę Chult, tropienie źródła Klątwy Śmierci i zejście do Tomb of the Nine Gods."
    />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Fira+Sans+Extra+Condensed:wght@400;500;600;700&amp;family=Voltaire&amp;family=Brygada+1918:wght@400;500;600;700&amp;display=swap"
    />

      rel="stylesheet"
      href="/core/templates/CampaignPage/CampaignStartup.css"
    />
    <link rel="stylesheet" href="./theme-fonts.css" />
    <link rel="stylesheet" href="/core/templates/HomeButton/HomeButton.css" />
    <link
      rel="stylesheet"
      href="/core/templates/YouTubePlaylistButton/YouTubePlaylistButton.css"
    />
    <link
      rel="stylesheet"
      href="/core/templates/SubpageNavbar/SubpageNavbar.css"
    />
    <link
      rel="stylesheet"
      href="/core/templates/SubpageNavbar/NavbarButton/NavbarButton.css"
    />
    <link
      rel="stylesheet"
      href="/core/templates/SubpageHero/SubpageHero.css"
    />
    <link
      rel="stylesheet"
      href="/core/templates/CharacterCard/CharacterCard.css"
    />
    <link

    />
    <link rel="stylesheet" href="/core/templates/Chronicle/Chronicle.css" />
    <link

    />

  </head>
  <body class="tomb-of-annihilation-page campaign-startup-loading">
    <header
      class="subpage-hero toa-hero"
      id="campaign-hero"
      style="--hero-background: url('/page/tomb-of-annihilation/res/graphics/hero-image.jpg')"
    >
      <div class="subpage-hero__copy">
        <p class="campaign-startup-kicker">
          D&amp;D · ARCHIWUM KAMPANII
        </p>
        <h1>
          TOMB OF ANNIHILATION
        </h1>
        <p class="campaign-startup-lead">
          Wyprawa przez parną dżunglę Chult, tropienie źródła Klątwy Śmierci, utrata kolejnych twarzy
          drużyny i zejście do miejsca, z którego nie każdy miał wrócić.
        </p>
      </div>
    </header>
    <main class="toa-content">
      <section id="campaign" data-page-section="campaign">
        <div id="campaign-intro"></div>
      </section>
      <section id="characters" data-page-section="characters" hidden>
        <header class="toa-section toa-character-intro">
          <div class="toa-section-mark" id="characters-kicker"></div>
          <h2 id="characters-title"></h2>
          <p id="characters-description"></p>
        </header>
        <div id="character-gallery"></div>
      </section>
      <section
        id="chronicle"
        data-page-section="chronicle"
        hidden
        class="toa-chronicle-panel"
      >
        <div id="campaign-chronicle" class="chronicle"></div>
      </section>
    </main>
    <footer class="toa-footer">
      <span>VENGRATH · TOMB OF ANNIHILATION</span
      ><a href="#campaign-hero">POWRÓT NA GÓRĘ ↑</a>
    </footer>
    <script type="module" src="./app.js"></script>
  </body>
</html>
