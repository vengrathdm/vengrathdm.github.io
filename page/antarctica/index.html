<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Antarctica Unfrozen: explore the map</title>
<meta name="description" content="Pan and zoom the whole 5-mile hex map of an ice-free Antarctica moved to the Northern Hemisphere.">
<link rel="stylesheet" href="leaflet/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Voltaire&display=swap" rel="stylesheet">
<style>
  html,body{height:100%;margin:0}
  body{background:#24486c;color:#28201a;font:15px/1.4 Georgia,"Times New Roman",serif}
  #map{position:absolute;inset:0;background:#24486c}
  .panel{position:absolute;z-index:1000;background:rgba(238,229,204,.94);border:1px solid #28201a;border-radius:3px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
  #head{top:10px;left:10px;padding:0;max-width:calc(100vw - 20px);background:transparent;border:0;border-radius:0;box-shadow:none}
  .home-brand{display:inline-flex;align-items:center;gap:.55rem;color:#f4efe5;text-decoration:none;font:1.2rem Voltaire,sans-serif;letter-spacing:.15em;white-space:nowrap;text-shadow:0 1px 5px rgba(0,0,0,.8)}
  .home-brand img{width:2.5rem;height:2.5rem;object-fit:contain;filter:drop-shadow(0 0 14px rgba(215,184,120,.22))}
  .home-brand:hover{color:#efd59c}
  #read{bottom:22px;left:10px;padding:6px 10px;font:600 14px/1.3 system-ui,sans-serif;min-width:11em}
  #read small{font-weight:400;color:#6b5d4c}
  .ruin{display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:#eee5cc;border:2px solid #28201a;font:700 17px/1 Georgia,serif;color:#28201a;box-shadow:0 1px 4px rgba(0,0,0,.4)}
  .leaflet-container{font:14px/1.4 system-ui,sans-serif}
  .leaflet-popup-content a{color:#7a2e1c;font-weight:600}
  #editor{top:10px;right:10px;width:250px;max-width:calc(100vw - 20px);max-height:calc(100vh - 20px);overflow:auto;padding:10px;font:13px/1.4 system-ui,sans-serif}
  #editorHead{display:flex;align-items:center;justify-content:space-between;gap:8px}
  #editorTools[hidden]{display:none}
  #editor label{display:block;margin-top:9px;font-weight:600}
  #editor select,#editor input:not([type=color]):not([type=file]){box-sizing:border-box;width:100%;margin-top:3px;padding:5px;border:1px solid #82745e;border-radius:3px;background:#fffaf0;color:#28201a}
  #editor input[type=color]{width:42px;height:28px;vertical-align:middle;margin:3px 0}
  #editor input[type=range]{width:100%;margin-top:5px;padding:0}
  #editor button,#editor .file-button{margin:7px 4px 0 0;padding:6px 9px;border:1px solid #665640;border-radius:3px;background:#e5d7b8;color:#28201a;font:600 12px system-ui,sans-serif;cursor:pointer}
  #editor button.active{background:#665640;color:#fff8e8}
  #editorHint{margin:8px 0 0;color:#665640;font-size:12px}
  #importData{display:none}
</style>
</head>
<body>
<div id="map"></div>
<div id="head" class="panel">
  <a class="home-brand" href="/home/" aria-label="Vengrath — strona główna"><img src="/core/graphics/favicon/mg-logo.png" alt=""><span>VENGRATH</span></a>
</div>
<div id="read" class="panel"><small>Move over the map for hex references</small></div>
<div id="editor" class="panel">
  <div id="editorHead"><strong>Hex overlays</strong><button id="editorToggle" type="button">Open editor</button></div>
  <div id="editorTools" hidden>
    <label>Overlay layer<select id="layerSelect"><option value="biome">Biome</option><option value="political">Political</option><option value="geographical">Geographical</option></select></label>
    <label>Region<select id="regionSelect"><option value="">Create a region first</option></select></label>
    <label>New region name<input id="regionName" type="text" placeholder="e.g. Temperate Forest"></label>
    <label>Region colour <input id="regionColor" type="color" value="#668b54"></label>
    <button id="createRegion" type="button">Create region</button><button id="paintToggle" type="button">Paint: off</button><button id="eraseToggle" type="button">Erase: off</button>
    <label>Brush size <span id="brushSizeValue">1 hex</span><input id="brushSize" type="range" min="0" max="5" step="1" value="0"></label>
    <p id="editorHint">Select a region, enable Paint, then hold and drag across the map. Brush size controls the radius. Changes save in this browser.</p>
    <button id="exportData" type="button">Export data</button><label class="file-button" for="importData">Import data</label><input id="importData" type="file" accept="application/json">
  </div>
</div>
<script src="leaflet/leaflet.js"></script>
<script>
(function(){
  var WN=27171, HN=36345, Z=7, S=8.04672, R=S/Math.sqrt(3), CS=1.5*R, KPP=S/48, SC=96, SR=68, YS=5873;
  var LAND=["C1", "D1", "C2", "B3", "C3", "A4", "B4", "C4", "D4", "E4", "F4", "A5", "B5", "C5", "D5", "E5", "F5", "A6", "B6", "C6", "D6", "E6", "F6", "A7", "C7", "D7", "E7", "F7", "G7", "B8", "C8", "D8", "E8", "F8", "G8", "A9", "B9", "C9", "D9", "E9", "F9", "G9", "A10", "B10", "C10", "D10", "E10", "F10", "B11", "C11", "D11", "E11"], POLE=[1900.0,3300.0];
  var map=L.map('map',{crs:L.CRS.Simple,minZoom:1,maxZoom:Z,zoomSnap:0.5,wheelPxPerZoomLevel:90,attributionControl:false});
  var ll=function(px,py){return map.unproject([px,py],Z)};
  var bounds=L.latLngBounds(ll(0,HN),ll(WN,0));
  L.tileLayer('tiles/{z}/{x}/{y}.jpg',{tileSize:512,minZoom:0,maxZoom:Z,bounds:bounds,noWrap:true,errorTileUrl:'ocean.jpg'}).addTo(map);
  map.setMaxBounds(bounds.pad(0.15));
  var m=/^#(\d+(?:\.\d+)?)\/(\d+)\/(\d+)$/.exec(location.hash);
  if(m) map.setView(ll(+m[2],+m[3]),Math.min(Z,+m[1])); else map.fitBounds(bounds);
  map.on('moveend',function(){var p=map.project(map.getCenter(),Z);
    history.replaceState(null,'','#'+map.getZoom()+'/'+Math.round(p.x)+'/'+Math.round(p.y));});

  function hexOf(x,y){
    var q=(2/3)*x/R, r=(-x/3+y/Math.sqrt(3))/R, s=-q-r, rq=Math.round(q), rr=Math.round(r), rs=Math.round(s);
    var dq=Math.abs(rq-q), dr=Math.abs(rr-r), ds=Math.abs(rs-s);
    if(dq>dr&&dq>ds) rq=-rr-rs; else if(dr>ds) rr=-rq-rs;
    return [rq, rr+(rq-(rq&1))/2];
  }
  var sid=function(i,j){return String.fromCharCode(65+i)+(j+1)}, two=function(n){return (n<10?'0':'')+n};
  var read=document.getElementById('read');
  function show(e){
    var p=map.project(e.latlng,Z);
    if(p.x<0||p.y<0||p.x>WN||p.y>HN){read.innerHTML='<small>Off the map</small>';return}
    var h=hexOf(p.x*KPP,p.y*KPP);
    if(h[0]<0||h[1]<0){read.innerHTML='<small>Off the map</small>';return}
    var i=Math.floor(h[0]/SC), j=Math.floor(h[1]/SR);
    read.innerHTML='Sheet '+sid(i,j)+' &middot; hex '+two(h[0]%SC+1)+two(h[1]%SR+1);
  }
  map.on('mousemove',show);
  var STORE='antarctica-hex-overlays-v1', layerNames=['biome','political','geographical'];
  var regionData={biome:[],political:[],geographical:[]}, overlayGroups={}, editMode=false, eraseMode=false, painting=false, lastPainted='';
  try{var saved=localStorage.getItem(STORE);if(saved){var parsed=JSON.parse(saved);layerNames.forEach(function(k){if(Array.isArray(parsed[k]))regionData[k]=parsed[k];});}}catch(err){console.warn('Could not load saved overlay data',err);}
  layerNames.forEach(function(k){overlayGroups[k]=L.layerGroup().addTo(map);});
  function saveData(){try{localStorage.setItem(STORE,JSON.stringify(regionData));}catch(err){setHint('Could not save in this browser. Export the data as a backup.');}}
  function setHint(t){document.getElementById('editorHint').textContent=t;}
  function currentLayer(){return document.getElementById('layerSelect').value;}
  function selectedRegion(){var id=document.getElementById('regionSelect').value;return regionData[currentLayer()].find(function(r){return r.id===id;});}
  function refreshRegions(preferred){var sel=document.getElementById('regionSelect'),arr=regionData[currentLayer()];sel.innerHTML='';arr.forEach(function(r){var o=document.createElement('option');o.value=r.id;o.textContent=r.name;sel.appendChild(o);});if(preferred&&arr.some(function(r){return r.id===preferred;}))sel.value=preferred;if(!arr.length){var o=document.createElement('option');o.value='';o.textContent='No regions yet';sel.appendChild(o);}}
  function addressKey(h){var i=Math.floor(h[0]/SC),j=Math.floor(h[1]/SR);return sid(i,j)+':'+two(h[0]%SC+1)+two(h[1]%SR+1);}
  function parseAddress(key){var m=/^([A-Z])(\d+):(\d{2})(\d{2})$/.exec(key);if(!m)return null;var si=m[1].charCodeAt(0)-65,sj=parseInt(m[2],10)-1,col=parseInt(m[3],10)-1,row=parseInt(m[4],10)-1;if(si<0||sj<0||col<0||col>=SC||row<0||row>=SR)return null;return [si*SC+col,sj*SR+row];}
  function hexVertices(key){var h=parseAddress(key);if(!h)return null;var cx=CS*h[0]/KPP,cy=S*(h[1]+0.5*(h[0]&1))/KPP,pts=[];for(var n=0;n<6;n++){var a=Math.PI*n/3;pts.push([cx+R*Math.cos(a)/KPP,cy+R*Math.sin(a)/KPP]);}return pts;}
  function darker(hex){var n=parseInt(hex.slice(1),16),r=Math.max(0,((n>>16)&255)-65),g=Math.max(0,((n>>8)&255)-65),b=Math.max(0,(n&255)-65);return '#'+[r,g,b].map(function(v){return ('0'+v.toString(16)).slice(-2);}).join('');}
  function renderLayer(k){var group=overlayGroups[k];group.clearLayers();regionData[k].forEach(function(region){var unique=Array.from(new Set(region.hexes)),edges=Object.create(null);unique.forEach(function(key){var pts=hexVertices(key);if(!pts)return;L.polygon(pts.map(function(p){return ll(p[0],p[1]);}),{stroke:false,fillColor:region.color,fillOpacity:0.34,interactive:false}).addTo(group);for(var n=0;n<6;n++){var a=pts[n],b=pts[(n+1)%6],ak=a[0].toFixed(2)+','+a[1].toFixed(2),bk=b[0].toFixed(2)+','+b[1].toFixed(2),id=ak<bk?ak+'|'+bk:bk+'|'+ak;if(!edges[id])edges[id]={count:0,a:a,b:b};edges[id].count++;}});Object.keys(edges).forEach(function(id){var e=edges[id];if(e.count===1)L.polyline([ll(e.a[0],e.a[1]),ll(e.b[0],e.b[1])],{color:darker(region.color),weight:2.2,opacity:1,interactive:false,lineCap:'round'}).addTo(group);});});}
  function renderAll(){layerNames.forEach(renderLayer);}
  function brushRadius(){return parseInt(document.getElementById('brushSize').value,10)||0;}
  function brushKeys(center){var q0=center[0],r0=center[1]-(q0-(q0&1))/2,rad=brushRadius(),keys=[];for(var dq=-rad;dq<=rad;dq++){for(var dr=-rad;dr<=rad;dr++){if(Math.max(Math.abs(dq),Math.abs(dr),Math.abs(dq+dr))>rad)continue;var q=q0+dq,ar=r0+dr,row=ar+(q-(q&1))/2;if(q<0||row<0)continue;var si=Math.floor(q/SC),sj=Math.floor(row/SR),sheet=sid(si,sj);if(LAND.indexOf(sheet)<0)continue;keys.push(addressKey([q,row]));}}return keys;}
  function assignBrush(latlng){var p=map.project(latlng,Z);if(p.x<0||p.y<0||p.x>WN||p.y>HN)return;var h=hexOf(p.x*KPP,p.y*KPP);if(h[0]<0||h[1]<0)return;var center=addressKey(h);if(center===lastPainted)return;lastPainted=center;var arr=regionData[currentLayer()],region=selectedRegion();if(!eraseMode&&!region){setHint('Create or select a region before painting.');return;}brushKeys(h).forEach(function(key){arr.forEach(function(r){r.hexes=r.hexes.filter(function(x){return x!==key;});});if(!eraseMode)region.hexes.push(key);});saveData();renderLayer(currentLayer());}

  document.getElementById('editorToggle').addEventListener('click',function(){var tools=document.getElementById('editorTools');tools.hidden=!tools.hidden;this.textContent=tools.hidden?'Open editor':'Close editor';});
  function stopEditing(){editMode=false;eraseMode=false;painting=false;map.dragging.enable();document.getElementById('paintToggle').textContent='Paint: off';document.getElementById('paintToggle').classList.remove('active');document.getElementById('eraseToggle').textContent='Erase: off';document.getElementById('eraseToggle').classList.remove('active');}
  function updateBrushLabel(){var r=brushRadius(),count=1+3*r*(r+1);document.getElementById('brushSizeValue').textContent=r===0?'1 hex':'radius '+r+' ('+count+' hexes)';}
  document.getElementById('brushSize').addEventListener('input',updateBrushLabel);
  document.getElementById('layerSelect').addEventListener('change',function(){stopEditing();refreshRegions();setHint('Select a region, enable Paint, then hold and drag across the map.');});
  document.getElementById('createRegion').addEventListener('click',function(){var name=document.getElementById('regionName').value.trim();if(!name){setHint('Enter a region name first.');return;}var region={id:'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:name,color:document.getElementById('regionColor').value,hexes:[]};regionData[currentLayer()].push(region);refreshRegions(region.id);saveData();setHint('Created '+name+'. Enable Paint to assign hexes.');});
  document.getElementById('regionSelect').addEventListener('change',function(){var r=selectedRegion();if(r){document.getElementById('regionName').value=r.name;document.getElementById('regionColor').value=r.color;}});
  document.getElementById('paintToggle').addEventListener('click',function(){editMode=!editMode;eraseMode=false;painting=false;map.dragging[editMode?'disable':'enable']();document.getElementById('eraseToggle').textContent='Erase: off';document.getElementById('eraseToggle').classList.remove('active');this.textContent='Paint: '+(editMode?'on':'off');this.classList.toggle('active',editMode);setHint(editMode?'Hold the mouse button and drag across hexes to paint. Map panning is paused while painting.':'Paint mode is off. Map panning is restored.');});
  document.getElementById('eraseToggle').addEventListener('click',function(){eraseMode=!eraseMode;editMode=eraseMode;painting=false;map.dragging[editMode?'disable':'enable']();document.getElementById('paintToggle').textContent='Paint: off';document.getElementById('paintToggle').classList.remove('active');this.textContent='Erase: '+(eraseMode?'on':'off');this.classList.toggle('active',eraseMode);setHint(eraseMode?'Hold the mouse button and drag to erase hexes. Map panning is paused while erasing.':'Erase mode is off. Map panning is restored.');});
  document.getElementById('exportData').addEventListener('click',function(){var blob=new Blob([JSON.stringify(regionData,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='antarctica-overlays.json';a.click();URL.revokeObjectURL(url);});
  document.getElementById('importData').addEventListener('change',function(e){var file=e.target.files&&e.target.files[0];if(!file)return;var reader=new FileReader();reader.onload=function(){try{var data=JSON.parse(reader.result);layerNames.forEach(function(k){if(Array.isArray(data[k]))regionData[k]=data[k].filter(function(r){return r&&typeof r.name==='string'&&typeof r.color==='string'&&Array.isArray(r.hexes);});});saveData();refreshRegions();renderAll();setHint('Overlay data imported.');}catch(err){setHint('Could not import that JSON file.');}};reader.readAsText(file);e.target.value='';});
  map.on('mousedown',function(e){if(!editMode)return;painting=true;lastPainted='';assignBrush(e.latlng);});
  map.on('mousemove',function(e){if(painting)assignBrush(e.latlng);});
  function endStroke(){painting=false;lastPainted='';}
  map.on('mouseup',endStroke);
  window.addEventListener('mouseup',endStroke);
  map.on('click',function(e){show(e);});
  renderAll();refreshRegions();updateBrushLabel();

  var grid=L.layerGroup();
  LAND.forEach(function(s){
    var i=s.charCodeAt(0)-65, j=parseInt(s.slice(1),10)-1;
    var x0=Math.max(0,(i*SC*CS-R)/KPP), y0=Math.max(0,(j*SR*S-S/2)/KPP), x1=Math.min(WN,((i+1)*SC*CS-0.5*R)/KPP), y1=Math.min(HN,((j+1)*SR*S)/KPP);
    L.rectangle([ll(x0,y1),ll(x1,y0)],{color:'#fff3c4',weight:1.5,fillColor:'#fff3c4',fillOpacity:0.02})
      .bindTooltip('Sheet '+s,{sticky:true})
      .bindPopup('<a href="../sheets/antarctica_hex_'+s+'.jpg" download="antarctica_hex_'+s+'.jpg">Download sheet '+s+'</a>')
      .addTo(grid);
  });
  var ph=hexOf(POLE[0],POLE[1]), pc=[CS*ph[0]/KPP, S*(ph[1]+0.5*(ph[0]&1))/KPP];
  function sheetHex(sheet,hex){
    var si=sheet.charCodeAt(0)-65, sj=parseInt(sheet.slice(1),10)-1;
    var col=parseInt(hex.slice(0,2),10)-1, row=parseInt(hex.slice(2,4),10)-1;
    if(!/^[A-Z]\d+$/.test(sheet)||!/^\d{4}$/.test(hex)||si<0||sj<0||col<0||col>=SC||row<0||row>=SR) throw new Error('Invalid sheet/hex address: '+sheet+' '+hex);
    var h=[si*SC+col,sj*SR+row];
    return ll(CS*h[0]/KPP,S*(h[1]+0.5*(h[0]&1))/KPP);
  }
  L.marker(sheetHex('F9','1606'),{icon:L.divIcon({className:'',html:'<div class="ruin" aria-label="Test Marker">★</div>',iconSize:[26,26],iconAnchor:[13,13]}),title:'Test Marker'})
    .bindPopup('<b>Test Marker</b><br>Test Descirption<br>Sheet F9, hex 1606.')
    .addTo(map);
  var ruins=L.marker(ll(pc[0],pc[1]),{icon:L.divIcon({className:'',html:'<div class="ruin" aria-label="Ruins">&there4;</div>',iconSize:[26,26],iconAnchor:[13,13]}),title:'South Pole ruins'})
    .bindPopup('<b>The South Pole</b><br>Drowned ruins, just offshore.<br>Sheet '+sid(Math.floor(ph[0]/SC),Math.floor(ph[1]/SR))+', hex '+two(ph[0]%SC+1)+two(ph[1]%SR+1)+'.').addTo(map);
  L.control.layers(null,{'Biome':overlayGroups.biome,'Political':overlayGroups.political,'Geographical':overlayGroups.geographical},{collapsed:true,position:'bottomright'}).addTo(map);
  L.control.scale({imperial:false,metric:false}).addTo(map);
})();
</script>
</body>
</html>
