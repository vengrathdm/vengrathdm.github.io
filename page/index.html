<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Player Mockup | Kronika D&amp;D</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-void: #09090b;
            --bg-surface: #111114;
            --bg-inset: #0c0c0e;
            --border-dark: #27272a;
            --border-brass: #c5a059;
            --border-brass-dim: #6e572b;
            --text-main: #e4e4e7;
            --text-muted: #a1a1aa;
            --text-brass: #d4af37;
            --font-display: 'Cinzel', serif;
            --font-body: 'Inter', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            border-radius: 0 !important;
        }

        body {
            background-color: var(--bg-void);
            color: var(--text-main);
            font-family: var(--font-body);
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 2rem 1rem;
        }

        .player-card {
            width: 100%;
            max-width: 760px;
            background-color: var(--bg-surface);
            border: 2px solid var(--border-dark);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85);
        }

        .player-header {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--border-dark);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .player-header h1 {
            font-family: var(--font-display);
            font-size: 1.15rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #ffffff;
        }

        .player-tag {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            padding: 0.2rem 0.55rem;
            background-color: var(--bg-inset);
            border: 1px solid var(--border-brass-dim);
            color: var(--text-brass);
            white-space: nowrap;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 */
            background-color: #000000;
            border-bottom: 1px solid var(--border-dark);
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .session-meta-bar {
            padding: 0.9rem 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            background-color: #0d0d10;
        }

        .session-number {
            font-family: var(--font-display);
            font-weight: 900;
            color: var(--text-brass);
            letter-spacing: 0.15em;
        }

        .session-meta-bar a {
            color: var(--text-brass);
            text-decoration: none;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-size: 0.75rem;
        }

        .session-meta-bar a:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <article class="player-card">
        <header class="player-header">
            <h1>Port Nyanzaru [D&amp;D 5e]</h1>
            <span class="player-tag">Chult · Wyprawa</span>
        </header>

        <div class="video-wrapper">
            <iframe
                src="https://www.youtube.com/embed/yttdA4b2HAU?rel=0"
                title="Tomb of Annihilation S1 - Port Nyanzaru"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin"
                allowfullscreen>
            </iframe>
        </div>

        <footer class="session-meta-bar">
            <span class="session-number">SESJA 01</span>
            <a href="https://www.youtube.com/watch?v=yttdA4b2HAU" target="_blank" rel="noopener noreferrer">Otwórz w YouTube ↗</a>
        </footer>
    </article>

</body>
</html>
