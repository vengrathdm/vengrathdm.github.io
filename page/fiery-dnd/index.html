<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Tron z Popiołu — kampania Dungeons & Dragons 5e o budzącym się smoku i pękającej Koronie."
    />
    <meta name="theme-color" content="#120a08" />
    <title>Tron z Popiołu — Vengrath</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="./theme-fonts.css" />
    <link
      rel="stylesheet"
      href="/core/templates/HomeButton/HomeButton.css"
    />
    <link
      rel="stylesheet"
      href="/core/templates/SubpageNavbar/SubpageNavbar.css"
    />
    <link
      rel="stylesheet"
      href="/core/templates/SubpageNavbar/NavbarButton/NavbarButton.css"
    />
    <link
      rel="stylesheet"
      href="/core/templates/SubpageHero/SubpageHero.css"
    />
    <link
      rel="stylesheet"
      href="/core/templates/Chronicle/ChronicleRecord/ChronicleRecord.css"
    />
    <link
      rel="stylesheet"
      href="/core/templates/Chronicle/PlayRecordingButton/PlayRecordingButton.css"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="fiery-dnd-page">
    <div id="campaign-hero"></div>

    <main class="fiery-main">
      <section
        class="fiery-section"
        id="campaign"
        data-page-section="campaign"
        aria-labelledby="campaign-title"
      >
        <div id="campaign-content"></div>
      </section>

      <section
        class="fiery-section"
        id="characters"
        data-page-section="characters"
        aria-labelledby="characters-title"
        hidden
      >
        <div id="characters-content"></div>
      </section>

      <section
        class="fiery-section"
        id="chronicle"
        data-page-section="chronicle"
        aria-labelledby="chronicle-title"
        hidden
      >
        <div id="chronicle-content"></div>
      </section>
    </main>

    <footer class="fiery-footer">
      <span>VENGRATH · TRON Z POPIOŁU</span>
      <a href="#campaign-hero">Wróć na górę ↑</a>
    </footer>

    <script type="module" src="./app.js"></script>
  </body>
</html>
