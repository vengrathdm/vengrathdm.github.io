<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Klątwa Śmierci — Wróżenie</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="veil" aria-hidden="true"><div class="fog fog-a"></div><div class="fog fog-b"></div><div class="fog fog-c"></div><div class="grain"></div></div>

  <header>
    <div class="sigil">✦</div>
    <div><b>KLĄTWA ŚMIERCI</b><span>ZAPIS WRÓŻENIA · CHULT</span></div>
    <div class="status"><i></i> WIZJA JEST OTWARTA</div>
  </header>

  <main>
    <section class="sanctum">
      <div class="altar">
        <div class="stone-ring">
          <div class="crystal" id="crystal">
            <div class="crystal-glass">
              <div class="vision-meta">
                <span id="visionNumber">WIZJA I</span>
                <span id="visionName">KLĄTWA ŚMIERCI</span>
              </div>
              <div id="vision" class="vision"></div>
              <div class="vision-noise"></div>
              <div class="vision-time" id="clock">00:00:00</div>
            </div>
          </div>
        </div>
        <div class="stand">
          <span>OBSYDIANOWY KAMIEŃ WRÓŻENIA</span>
          <span>Chult · Omu · Poza</span>
        </div>
      </div>

      <aside class="ritual-panel">
        <div class="panel-title"><span>INDEKS WIZJI</span><small>9 WIZJI</small></div>
        <div id="visions" class="vision-list"></div>
        <div class="divider"></div>
        <button id="awaken" class="ritual-button">OŻYW WIZJĘ</button>
        <button id="dim" class="sub-button">PRZYGAŚ WIDZENIE</button>
        <div class="omen">
          <span>OSTATNI OMEN</span>
          <b id="omenText">UMARLI NIE ŚPIĄ.</b>
        </div>
      </aside>
    </section>
  </main>

  <footer>KRONIKA CHULT · PRYWATNY ZAPIS MISTRZA GRY · SOULMONGER NADAL DZIAŁA</footer>
  <script src="script.js"></script>
</body>
</html>
