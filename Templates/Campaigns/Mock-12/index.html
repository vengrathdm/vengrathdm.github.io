<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campaign_Name</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="crt" aria-hidden="true"><div class="scanlines"></div><div class="noise"></div></div>
  <header>
    <b>Site_Name</b>
    <span>Channel_Status_Label</span>
    <span class="hint">Interface_Instruction</span>
  </header>

  <main>
    <section class="station">
      <div class="tv-column">
        <div class="tv">
          <div class="screen" id="screen">
            <div class="osd">
              <span id="channel">CH 01</span>
              <span class="rec"><i></i> Recording_Status</span>
            </div>
            <div id="program" class="program"></div>
            <div class="timestamp" id="clock">00:00:00</div>
            <div class="tracking"></div>
          </div>
          <div class="tv-controls"><span>Device_Model_Name</span><span>Tuner_Label · Volume_Label</span></div>
        </div>

        <div class="vcr">
          <div class="vcr-top">
            <b>VCR_Model_Name</b>
            <span>Format_Label · Mode_Label</span>
            <em id="tapeStatus">No_Tape_Status</em>
          </div>

          <div class="slot">
            <div class="cassette" id="cassette">
              <div class="reel"></div>
              <div class="reel"></div>
              <b id="cassetteLabel">Cassette_Prompt</b>
            </div>
          </div>

          <div class="vcr-buttons">
            <button id="rew">Rewind_Label</button>
            <button id="play">Play_Label</button>
            <button id="stop">Stop_Label</button>
            <button id="ff">Fast_Forward_Label</button>
            <button id="eject">Eject_Label</button>
            <span id="vcrCounter">00:00:00</span>
          </div>

          <div class="tapes">
            <button data-tape="tape_01"><small>Tape_01</small><b>Tape_Title_01</b></button>
            <button data-tape="tape_02"><small>Tape_02</small><b>Tape_Title_02</b></button>
            <button data-tape="tape_03"><small>Tape_03</small><b>Tape_Title_03</b></button>
            <button data-tape="tape_04"><small>Tape_04</small><b>Tape_Title_04</b></button>
            <button data-tape="tape_05"><small>Tape_05</small><b>Tape_Title_05</b></button>
            <button data-tape="tape_06"><small>Tape_06</small><b>Tape_Title_06</b></button>
          </div>
        </div>
      </div>

      <aside class="remote">
        <div class="remote-brand">Device_Brand <span>Remote_Label</span></div>
        <div class="remote-screen">CH <b id="remoteCh">01</b></div>
        <button class="power" id="power">Power_Label</button>

        <div class="numeric">
          <button data-ch="1">1</button><button data-ch="2">2</button><button data-ch="3">3</button>
          <button data-ch="4">4</button><button data-ch="5">5</button><button data-ch="6">6</button>
          <button data-ch="7">7</button><button data-ch="8">8</button><button data-ch="9">9</button>
          <button data-ch="0">0</button>
        </div>

        <div class="remote-row"><button id="volDown">Volume_Down</button><button id="volUp">Volume_Up</button></div>
        <div class="remote-row"><button id="chDown">Channel_Down</button><button id="chUp">Channel_Up</button></div>

        <div class="dpad">
          <button>Up</button><button>Left</button><button>OK</button><button>Right</button><button>Down</button>
        </div>

        <div class="remote-row"><button id="menu">Menu</button><button id="input">Input</button></div>
        <div class="led"></div>
      </aside>
    </section>
  </main>

  <footer>Site_Footer_Label</footer>
  <script src="script.js"></script>
</body>
</html>
