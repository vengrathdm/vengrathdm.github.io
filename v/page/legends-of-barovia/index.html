<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Legends of Barovia — kampania Vengrath. Dossier świata, postaci drużyny i kronika.">
  <meta name="theme-color" content="#08090b">
  <title>Legends of Barovia — Vengrath</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="./theme-fonts.css">
  <link rel="stylesheet" href="/v/core/templates/HomeButton/HomeButton.css">
  <link rel="stylesheet" href="/v/core/templates/YouTubePlaylistButton/YouTubePlaylistButton.css">
  <link rel="stylesheet" href="/v/core/templates/SubpageNavbar/SubpageNavbar.css">
  <link rel="stylesheet" href="/v/core/templates/SubpageNavbar/NavbarButton/NavbarButton.css">
  <link rel="stylesheet" href="/v/core/templates/SubpageHero/SubpageHero.css">
  <link rel="stylesheet" href="/v/core/templates/CharacterCard/CharacterCard.css">
  <link rel="stylesheet" href="/v/core/templates/CharacterCard/Achievements/Achievements.css">
  <link rel="stylesheet" href="/v/core/templates/CharacterGallery/CharacterGallery.css">
  <link rel="stylesheet" href="/v/core/templates/Chronicle/Chronicle.css">
  <link rel="stylesheet" href="/v/core/templates/Chronicle/ChronicleRecord/ChronicleRecord.css">
  <link rel="stylesheet" href="/v/core/templates/Chronicle/PlayRecordingButton/PlayRecordingButton.css">
  <link rel="stylesheet" href="/v/core/templates/AudioPlayerButton/AudioPlayerButton.css">
  <link rel="stylesheet" href="./sections/campaign/campaign.css">
  <link rel="stylesheet" href="./sections/characters/characters.css">
  <link rel="stylesheet" href="./sections/chronicle/chronicle.css">
</head>
<body class="legends-of-barovia-page">
  <div id="campaign-hero"></div>
  <main class="lob-content">
    <section class="lob-tab-panel" id="campaign" data-page-section="campaign">
      <section class="lob-card lob-card-main">
        <div class="lob-card-title"><span>01</span><strong>GŁÓWNA</strong></div>
        <div class="lob-card-body">
          <div class="lob-intro-grid">
            <article class="lob-paper">
              <div class="lob-section-mark">AKTA / 01</div>
              <h2 id="campaign-intro-title"></h2>
              <div id="campaign-intro-copy"></div>
            </article>
            <aside class="lob-case" aria-label="Dossier kampanii">
              <div class="lob-case-label">DOSSIER</div>
              <div id="campaign-dossier"></div>
            </aside>
          </div>
        </div>
      </section>
      <section class="lob-party-portrait">
        <div class="lob-party-copy">
          <div class="lob-section-mark">PORTRET DRUŻYNY</div>
          <h2 id="party-title"></h2>
          <p id="party-description"></p>
        </div>
        <figure class="lob-party-image">
          <img id="party-image" alt="Portret drużyny Legends of Barovia" loading="lazy">
        </figure>
      </section>
      <section class="lob-manifesto">
        <div class="lob-manifesto-symbol" aria-hidden="true">☾</div>
        <div>
          <div class="lob-section-mark">ZASADA BAROVII</div>
          <p id="manifesto-quote"></p>
          <span id="manifesto-tags"></span>
        </div>
      </section>
      <section class="lob-source-panel">
        <div>
          <div class="lob-section-mark">ŹRÓDŁO ŚWIATA</div>
          <h2 id="source-title"></h2>
          <p id="source-description"></p>
        </div>
        <a id="source-link" target="_blank" rel="noopener noreferrer">OFICJALNA STRONA →</a>
      </section>
    </section>

    <section class="lob-tab-panel" id="characters" data-page-section="characters" hidden>
      <section class="lob-section lob-character-intro">
        <div class="lob-section-mark" id="characters-kicker"></div>
        <h2 id="characters-title"></h2>
        <p id="characters-description"></p>
      </section>
      <section class="lob-character-quote">
        <div class="lob-section-mark">GŁOS Z MGŁY</div>
        <p id="characters-quote"></p>
        <span id="characters-attribution"></span>
      </section>
      <div id="character-gallery" aria-live="polite"></div>
    </section>

    <section class="lob-tab-panel lob-chronicle-panel" id="chronicle" data-page-section="chronicle" hidden>
      <section class="lob-section lob-chronicle-intro">
        <div class="lob-section-mark" id="chronicle-kicker"></div>
        <h2 id="chronicle-title"></h2>
        <p id="chronicle-description"></p>
      </section>
      <section class="lob-section">
        <div class="lob-section-head">
          <div>
            <div class="lob-section-mark">ZAPISKI KAMPANII</div>
            <h2>Sesje</h2>
          </div>
          <p>Chronologia wydarzeń i nagrania kolejnych etapów wyprawy przez Barovię.</p>
        </div>
        <div id="campaign-chronicle"></div>
      </section>
    </section>
  </main>

  <footer class="lob-footer">
    <span>VENGRATH · LEGENDS OF BAROVIA</span>
    <a href="#campaign-hero">POWRÓT NA GÓRĘ ↑</a>
  </footer>

  <script type="module">
    import { createSubpageHero } from "/v/core/templates/SubpageHero/SubpageHero.js";
    import { mountSubpageNavbar } from "/v/core/templates/SubpageNavbar/SubpageNavbar.js";
    import { CharacterGallery } from "/v/core/templates/CharacterGallery/CharacterGallery.js";
    import { createChronicleRecord } from "/v/core/templates/Chronicle/ChronicleRecord/ChronicleRecord.js";
    import { AudioPlayer } from "/v/core/templates/AudioPlayer/AudioPlayer.js";
    import { mountAudioPlayerButton } from "/v/core/templates/AudioPlayerButton/AudioPlayerButton.js";

    const manifestResponse = await fetch("./manifest.json");
    const themeResponse = await fetch("./theme.json");
    const contentResponse = await fetch("./content.json");

    if (!manifestResponse.ok || !themeResponse.ok || !contentResponse.ok) {
      throw new Error("Nie udało się wczytać konfiguracji kampanii.");
    }

    const [manifest, theme, content] = await Promise.all([
      manifestResponse.json(),
      themeResponse.json(),
      contentResponse.json()
    ]);

    const campaign = content.campaign;
    const characters = content.characters;
    const chronicle = content.chronicle;

    document.documentElement.style.setProperty("--theme-base-1", theme.colors.base1);
    document.documentElement.style.setProperty("--theme-accent-1", theme.colors.accent1);
    document.documentElement.style.setProperty("--theme-accent-2", theme.colors.accent2);
    document.documentElement.style.setProperty("--campaign-accent", theme.colors.accent2);

    const hero = createSubpageHero({
      title: campaign.title,
      backgroundImage: theme.heroImage,
      theme: { accent: theme.colors.accent2 }
    });
    hero.id = "campaign-hero";
    hero.querySelector("h1").insertAdjacentHTML("beforebegin", '<p class="lob-hero-kicker"></p>');
    hero.querySelector(".lob-hero-kicker").textContent = campaign.kicker;
    hero.querySelector("h1").insertAdjacentHTML("afterend", '<p class="lob-hero-lead"></p>');
    hero.querySelector(".lob-hero-lead").textContent = campaign.lead;
    const navContainer = document.createElement("div");
    navContainer.className = "lob-navbar-mount";
    hero.prepend(navContainer);
    document.querySelector("#campaign-hero").replaceWith(hero);

    mountSubpageNavbar(navContainer, {
      playlistUrl: manifest.playlistUrl,
      sections: [
        { text: "GŁÓWNA", sectionLink: "campaign", color: theme.colors.accent2 },
        { text: "POSTACI", sectionLink: "characters", color: theme.colors.accent2 },
        { text: "KRONIKA DRUŻYNY", sectionLink: "chronicle", color: theme.colors.accent2 }
      ]
    });

    document.querySelector("#campaign-intro-title").textContent = campaign.introTitle;
    document.querySelector("#campaign-intro-copy").replaceChildren(...campaign.introParagraphs.map((text) => {
      const paragraph = document.createElement("p");
      paragraph.textContent = text;
      return paragraph;
    }));

    document.querySelector("#campaign-dossier").replaceChildren(...campaign.dossier.map(([label, value]) => {
      const row = document.createElement("div");
      row.className = "lob-case-row";
      const key = document.createElement("span");
      key.textContent = label;
      const detail = document.createElement("strong");
      detail.textContent = value;
      if (label === "STATUS") detail.className = "lob-active";
      row.append(key, detail);
      return row;
    }));

    document.querySelector("#party-title").textContent = campaign.partyTitle;
    document.querySelector("#party-description").textContent = campaign.partyDescription;
    document.querySelector("#party-image").src = campaign.partyImage;
    document.querySelector("#manifesto-quote").textContent = "„" + campaign.manifesto + "”";
    document.querySelector("#manifesto-tags").textContent = campaign.manifestoTags;
    document.querySelector("#source-title").textContent = campaign.sourceTitle;
    document.querySelector("#source-description").textContent = campaign.sourceDescription;
    document.querySelector("#source-link").href = campaign.sourceUrl;

    document.querySelector("#characters-kicker").textContent = characters.kicker;
    document.querySelector("#characters-title").textContent = characters.title;
    document.querySelector("#characters-description").textContent = characters.description;
    document.querySelector("#characters-quote").textContent = "„" + characters.quote + "”";
    document.querySelector("#characters-attribution").textContent = characters.quoteAttribution;

    const gallery = new CharacterGallery(document.querySelector("#character-gallery"), {
      characterIds: characters.characterIds
    });
    await gallery.render();

    document.querySelector("#chronicle-kicker").textContent = chronicle.kicker;
    document.querySelector("#chronicle-title").textContent = chronicle.title;
    document.querySelector("#chronicle-description").textContent = chronicle.description;
    const chronicleContainer = document.querySelector("#campaign-chronicle");
    chronicleContainer.classList.add("chronicle");
    chronicleContainer.replaceChildren(...chronicle.sessions.map((session) =>
      createChronicleRecord(session, { accent: theme.colors.accent2 })
    ));

    const audioPlayer = new AudioPlayer({
      src: manifest.audio.src,
      storageKey: manifest.audio.continuationKey
    });
    mountAudioPlayerButton(audioPlayer, theme.audioColor);
  </script>
</body>
</html>
