<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Vengrath Hall of Fame — archiwum postaci z kampanii.">
  <meta name="theme-color" content="#0a100d">
  <title>Hall of Fame — Vengrath</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="noise"></div>
  <header class="hero">
    <nav>
      <a class="back" href="../"><span>←</span> VENGRATH</a>
      <span class="edition">CHARACTER ARCHIVE / 05</span>
    </nav>
    <div class="hero-grid"></div>
    <div class="hero-copy">
      <div class="hero-kicker"><span>VENGRATH</span><span>ARCHIWUM POSTACI</span></div>
      <h1>HALL <span>OF</span> FAME</h1>
      <div class="hero-foot">
        <p>Historie postaci zapisane przy stołach Vengratha.</p>
        <div class="hero-mark">✦</div>
      </div>
    </div>
    <div class="hero-orbit orbit-a"></div>
    <div class="hero-orbit orbit-b"></div>
  </header>

  <main>
    <section class="archive" aria-label="Archiwum postaci">
      <div class="archive-head">
        <div>
          <span class="section-label">ARCHIWUM / POSTACIE</span>
          <h2>Galeria</h2>
        </div>
        <div class="archive-count">
          <span class="count-label">REKORDY</span>
          <span id="resultCount" class="result">ŁADOWANIE…</span>
        </div>
      </div>

      <div class="controls">
        <label class="search">
          <span>⌕</span>
          <input id="search" type="search" placeholder="Szukaj postaci, gracza, kampanii, klasy, rasy lub statusu…" autocomplete="off">
          <kbd>/</kbd>
        </label>
        <div class="filters">
          <label><small>GRACZ</small><select id="playerFilter"><option value="">Wszyscy gracze</option></select></label>
          <label><small>KAMPANIA</small><select id="campaignFilter"><option value="">Wszystkie kampanie</option></select></label>
          <label><small>KLASA</small><select id="classFilter"><option value="">Wszystkie klasy</option></select></label>
          <label><small>RASA</small><select id="raceFilter"><option value="">Wszystkie rasy</option></select></label>
          <label><small>STATUS</small><select id="statusFilter"><option value="">Wszystkie statusy</option></select></label>
          <button id="clearFilters" type="button">RESET FILTRÓW</button>
        </div>
      </div>

      <div id="grid" class="grid" aria-live="polite"></div>
      <div id="empty" class="empty" hidden>NIE ZNALEZIONO POSTACI / ZMIEŃ KRYTERIA</div>
    </section>
  </main>

  <div id="modal" class="modal" hidden aria-hidden="true">
    <div class="modal-backdrop" data-close></div>
    <section class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalName">
      <button id="modalClose" class="modal-close" type="button" aria-label="Zamknij">×</button>
      <div id="modalContent" class="modal-content"></div>
    </section>
  </div>

  <footer>
    <a href="#">↑ GÓRA</a>
    <span>HALL OF FAME / VENGRATH ARCHIVE</span>
    <span>EVERY STORY LEAVES A TRACE</span>
  </footer>
  <script src="./scripts.js"></script>
</body>
</html>
